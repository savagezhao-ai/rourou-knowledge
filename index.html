        const catLabels = {

        };

        let activeCat = "all";

        function renderArticles() {
            const listContainer = document.getElementById("article-list");
            let filtered = [...articles].sort((a, b) => b.date.localeCompare(a.date));

            if (activeCat !== "all") {
                filtered = filtered.filter(a => a.cat === activeCat);
            }

            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="empty-state"><div class="icon">📭</div><h3>这个分类还没有文章哦</h3><p>敬请期待，更多精彩内容即将上线！</p></div>`;
            } else {
                listContainer.innerHTML = filtered.map(a => `
                    <a href="${a.path}" class="article-card">
                        <div class="article-header">
                            <div class="article-title">${a.title}</div>
                            <div class="article-date">${a.displayDate}</div>
                        </div>
                        <div class="article-desc">${a.desc}</div>
                        <div class="article-tags">
                            <span class="tag cat-${a.cat}">${catLabels[a.cat]}</span>
                        </div>
                    </a>
                `).join("");
            }

            // 头部统计始终显示总条数，不随分类筛选变化
            document.getElementById("article-count").textContent = articles.length;
        }

        function filterArticles(cat) {
            activeCat = cat;
            document.querySelectorAll(".filter-btn").forEach(b => {
                b.classList.toggle("active", b.dataset.cat === cat);
            });
            renderArticles();
        }

        renderArticles();
