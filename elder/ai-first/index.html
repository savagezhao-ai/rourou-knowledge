<html lang="zh-CN">
<head>

<title>装好了，第一句话怎么说 · 肉肉的 AI 科研小站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #fbf6ee;
    color: #2b2b2b;
    font-size: 20px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  #app {
    max-width: 560px; margin: 0 auto; height: 100%;
    display: flex; flex-direction: column;
    padding: 0 22px env(safe-area-inset-bottom, 0);
    position: relative;
  }

  /* 顶部 */
  .topbar {
    flex: 0 0 auto; padding: 18px 0 6px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 15px; color: #a09a90;
  }
  .topbar a { color: #a09a90; text-decoration: none; }
  .topbar .spk {
    background: none; border: 1px solid #e0d8ca; color: #8a8377;
    font-size: 15px; padding: 5px 13px; border-radius: 999px;
    cursor: pointer; font-family: inherit;
  }
  .topbar .spk.on { background: #1f6b4a; border-color: #1f6b4a; color: #fff; }

  /* 主体 */
  .stage { flex: 1 1 auto; display: flex; flex-direction: column; overflow-y: auto; padding: 8px 0 4px; }
  .screen { animation: fade .38s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .step {
    display: inline-block; font-size: 15px; color: #1f6b4a;
    background: #e6f0ea; padding: 3px 12px; border-radius: 999px;
    margin-bottom: 14px; letter-spacing: .5px;
  }
  h1 {
    font-size: 30px; line-height: 1.4; font-weight: 800;
    color: #1a1a1a; letter-spacing: -.5px; margin-bottom: 18px;
  }
  h1.big { font-size: 29px; }
  p { margin-bottom: 16px; color: #45403a; }
  p.lead { font-size: 21px; color: #33302c; }
  em { font-style: normal; font-weight: 700; color: #b45309;
       background: linear-gradient(transparent 62%, #fde4bb 62%); padding: 0 2px; }
  strong { color: #1f6b4a; }

  /* 引用块：真的欢迎语 */
  .quote {
    background: #fff; border-radius: 18px; padding: 26px 22px;
    box-shadow: 0 1px 3px rgba(120,100,70,.09), 0 8px 24px -12px rgba(120,100,70,.22);
    margin: 8px 0 20px; text-align: center;
    position: relative;
  }
  .quote .q { font-size: 25px; font-weight: 700; color: #1a1a1a; letter-spacing: -.3px; }
  .quote .src { font-size: 14px; color: #a8a29a; margin-top: 12px; }
  .quote .bubble {
    width: 46px; height: 46px; border-radius: 50%; background: #1f6b4a;
    margin: 0 auto 16px; display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }

  /* 图标块 */
  .appicon { text-align: center; margin: 10px 0 22px; }
  .appicon img {
    width: 118px; height: 118px; border-radius: 26px;
    box-shadow: 0 6px 22px -6px rgba(60,50,30,.3);
    display: block; margin: 0 auto;
  }
  .appicon .name { font-size: 17px; color: #6b6459; margin-top: 12px; }

  /* 要念的话 */
  .saybox {
    background: #1f6b4a; color: #fff; border-radius: 18px;
    padding: 22px 20px; margin: 6px 0 8px;
  }
  .saybox .lab { font-size: 15px; color: #a8d4be; margin-bottom: 8px; letter-spacing: .5px; }
  .saybox .line { font-size: 26px; font-weight: 700; line-height: 1.5; letter-spacing: -.3px; }
  .saybox button {
    margin-top: 16px; background: rgba(255,255,255,.16); color: #fff;
    border: none; border-radius: 999px; padding: 9px 20px;
    font-size: 17px; font-family: inherit; cursor: pointer;
  }

  /* 提示条 */
  .warn {
    background: #fff8ec; border-left: 4px solid #e8a33a;
    border-radius: 0 12px 12px 0; padding: 14px 16px;
    font-size: 18px; color: #6b5a3a; margin: 16px 0;
  }

  /* 清单 */
  .asklist { list-style: none; }
  .asklist li {
    background: #fff; border-radius: 14px; padding: 15px 18px;
    margin-bottom: 10px; font-size: 19px; color: #33302c;
    box-shadow: 0 1px 2px rgba(120,100,70,.08);
    display: flex; gap: 12px; align-items: flex-start;
  }
  .asklist li > div { min-width: 0; flex: 1 1 auto; overflow-wrap: anywhere; }
  .asklist li span { color: #c9c2b6; flex: 0 0 auto; font-size: 15px; padding-top: 3px; }

  /* 底部按钮 */
  .footer { flex: 0 0 auto; padding: 12px 0 22px; }
  .btn {
    display: block; width: 100%; border: none; border-radius: 16px;
    padding: 20px 16px; font-size: 22px; font-weight: 700;
    font-family: inherit; cursor: pointer; letter-spacing: .5px;
    background: #1f6b4a; color: #fff;
    box-shadow: 0 6px 18px -8px rgba(31,107,74,.65);
    transition: transform .12s ease, box-shadow .2s;
  }
  .btn:active { transform: scale(.985); box-shadow: 0 3px 10px -6px rgba(31,107,74,.6); }
  .btn.ghost {
    background: #fff; color: #1f6b4a; border: 1.5px solid #cfe0d6;
    box-shadow: none; margin-top: 10px; font-size: 19px; padding: 16px;
  }
  .btn.small { font-size: 18px; padding: 15px; }

  /* 二维码 */
  .qrwrap { text-align: center; padding: 10px 0; }
  .qrwrap img { width: 200px; height: 200px; border-radius: 12px; background: #fff; padding: 8px; }
  .qrwrap p { font-size: 17px; color: #6b6459; margin-top: 12px; }

  /* 证书 */
  .cert {
    background: #fff; border-radius: 20px; padding: 32px 24px; text-align: center;
    border: 2px solid #e8dfd0; margin: 8px 0 20px;
    box-shadow: 0 10px 30px -16px rgba(120,100,70,.35);
  }
  .cert .seal {
    width: 72px; height: 72px; border-radius: 50%;
    background: linear-gradient(135deg, #1f6b4a, #2f8a62);
    color: #fff; font-size: 34px; display: flex; align-items: center;
    justify-content: center; margin: 0 auto 18px;
  }
  .cert h2 { font-size: 24px; color: #1a1a1a; margin-bottom: 8px; }
  .cert .sub { font-size: 17px; color: #8a8377; margin-bottom: 20px; }
  .cert .steps3 { text-align: left; border-top: 1px dashed #e8dfd0; padding-top: 20px; }
  .cert .steps3 div { font-size: 18px; color: #45403a; margin-bottom: 12px; padding-left: 30px; position: relative; }
  .cert .steps3 div::before {
    content: "✓"; position: absolute; left: 0; top: 0;
    color: #1f6b4a; font-weight: 700;
  }
  .cert .date { font-size: 15px; color: #a8a29a; margin-top: 18px; }

  .tiny { font-size: 15px; color: #a8a29a; line-height: 1.7; }
</style>

<script>
(function(){
  var K='rourou_sc';
  var SC=null, cur=null;
  try{
    cur=new URLSearchParams(location.search).get('sharecode');
    if(cur){ SC=cur; try{ sessionStorage.setItem(K,cur); }catch(e){} }
    else { try{ SC=sessionStorage.getItem(K); }catch(e){} }
  }catch(e){}
  if(!SC) return;

  // 站内地址补 sharecode；站外/已带参/非 http 返回 null
  function withSC(u){
    if(!u) return null;
    try{
      var x=new URL(u, location.href);
      if(x.protocol!=='http:' && x.protocol!=='https:') return null;
      if(x.origin!==location.origin) return null;
      if(x.searchParams.get('sharecode')===SC) return null;
      x.searchParams.set('sharecode',SC);
      return x.href;
    }catch(e){ return null; }
  }

  // 无参进入时补参数跳转（脚本捕获不到的情况兜底）
  if(!cur){
    var self=withSC(location.href);
    if(self && !/[?&]sharecode=/.test(location.search)){
      location.replace(self);
      return;
    }
  }

  // ① 点击拦截：先于站内任何处理器，动态渲染的卡片也覆盖
  document.addEventListener('click', function(e){
    var t=e.target;
    while(t && t!==document && t.tagName!=='A') t=t.parentNode;
    if(!t || t===document) return;
    if(t.target && t.target!=='_self') return;
    var h=t.getAttribute('href');
    if(!h || /^(mailto:|tel:|javascript:|#)/i.test(h)) return;
    var nu=withSC(t.href);
    if(!nu) return;
    e.preventDefault();
    e.stopPropagation();
    location.href=nu;
  }, true);

  // ② 静态与动态插入的资源统一补参
  var ATTRS=['src','href','poster','srcset'];
  var SEL='img[src],img[srcset],video[src],video[poster],audio[src],source[src],source[srcset],'+
          'script[src],link[rel=stylesheet][href],link[rel=preload][href],a[href]';
  function fixOne(el,attr){
    var v=el.getAttribute(attr);
    if(!v) return;
    if(attr==='srcset'){
      var changed=false;
      var parts=v.split(',').map(function(x){
        var t=x.trim().split(/\s+/);
        if(!t[0]) return x;
        var nu=withSC(t[0]);
        if(nu){ t[0]=nu; changed=true; }
        return t.join(' ');
      });
      if(changed) el.setAttribute('srcset',parts.join(', '));
      return;
    }
    var nu=withSC(v);
    if(nu) el.setAttribute(attr,nu);
  }
  function fixEl(el){
    for(var k=0;k<ATTRS.length;k++){
      if(el.hasAttribute && el.hasAttribute(ATTRS[k])) fixOne(el,ATTRS[k]);
    }
  }
  function fix(root){
    var scope=(root&&root.querySelectorAll)?root:document;
    var els=scope.querySelectorAll(SEL);
    for(var i=0;i<els.length;i++) fixEl(els[i]);
  }

  // ③ 资源加载失败时补参重试一次（防漏网）
  document.addEventListener('error', function(e){
    var el=e.target;
    if(!el||!el.tagName) return;
    var tag=el.tagName;
    if(tag!=='IMG'&&tag!=='VIDEO'&&tag!=='SOURCE'&&tag!=='AUDIO') return;
    if(el.getAttribute('data-sc-retry')) return;
    var nu=withSC(el.getAttribute('src')||'');
    if(!nu) return;
    el.setAttribute('data-sc-retry','1');
    el.setAttribute('src',nu);
  }, true);

  function boot(){
    fix(document);
    try{
      new MutationObserver(function(ms){
        for(var i=0;i<ms.length;i++){
          var added=ms[i].addedNodes;
          for(var j=0;j<added.length;j++){
            var n=added[j];
            if(n.nodeType!==1) continue;
            fixEl(n);
            if(n.querySelectorAll) fix(n);
          }
        }
      }).observe(document.documentElement,{childList:true,subtree:true});
    }catch(e){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();
</script>

  cur = SCREENS[i];

  var st = document.getElementById("stage");
  st.innerHTML = '<div class="screen">' + cur.head() + '</div>';
  st.scrollTop = 0;

  var ft = document.getElementById("footer");
  var html = "";
  for (var k = 0; k < cur.btns.length; k++) {
    var b = cur.btns[k];
    html += '<button class="btn' + (b.ghost ? " ghost" : "") + '" type="button" data-k="' + k + '">'
          + b.text + '</button>';
  }
  ft.innerHTML = html;
  Array.prototype.forEach.call(ft.querySelectorAll(".btn"), function (el) {
    el.onclick = function () {
      var b = cur.btns[+el.getAttribute("data-k")];
      if (b && b.act) b.act();
    };
  });

  if (speakOn) {
    var t = st.innerText.replace(/\s+/g, " ").slice(0, 90);
    speak(t);
  }
  try { localStorage.setItem("aifirst_pos", id); } catch (e) {}
}

function readAloud() {
  if (!window.speechSynthesis) { alert("这个浏览器不支持朗读，可以让家里人念给你听。"); return; }
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance("今天几号？天气热不热？");
  u.lang = "zh-CN"; u.rate = 0.82;
  window.speechSynthesis.speak(u);
}

/* ---------- 朗读开关 ---------- */
document.getElementById("spk").onclick = function () {
  speakOn = !speakOn;
  this.className = "spk" + (speakOn ? " on" : "");
  this.textContent = speakOn ? "朗读中" : "朗读";
  if (speakOn) {
    var st = document.getElementById("stage");
    speak(st.innerText.replace(/\s+/g, " ").slice(0, 90));
  } else if (window.speechSynthesis) {
    window.speechSynthesis.cancel();
  }
};

/* ---------- 启动 ---------- */
(function () {
  var saved = "";
  try { saved = localStorage.getItem("aifirst_pos") || ""; } catch (e) {}
  go("start");
  if (saved && saved !== "start" && idxOf(saved) > 0) {
    var first = document.querySelector("#footer .btn");
    if (first) {
      first.textContent = "接着上次，继续 →";
      first.onclick = function () { go(saved); };
    }
  }
})();
</script>
</body>
