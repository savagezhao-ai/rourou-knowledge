<body>

<div id="topbar">
  <div id="brand">英语语法进阶 <span>· 动词 / 时态 / 被动</span></div>
  <div id="track"><div id="fill"></div></div>
  <div id="stars">过关 <b id="dn">0</b>/<b id="dt">0</b></div>
</div>

<main id="app"></main>

<script>
const L = [
/* ============ 第一章 · 动词的五种岗位 ============ */
{
  id:`g1`, ch:`第一章 · 动词的五种岗位`, lv:`基础`, name:`动词到底在句子里干什么`,
  sub:`一句话里只有一个“真干活”的动词，其余的都在帮它`,
  body:`
    <p>先看三句话，都是同一个词 break（打破）：</p>
    <div class="eg"><b>Tom <span class="o">broke</span> the cup.</b><em>汤姆打破了杯子。→ 这里 break 在说“做了什么”。</em></div>
    <div class="eg"><b>The cup <span class="o">is</span> broken.</b><em>杯子是破的。→ 这里 is 在说“是什么样”。（这句还有另一种理解，第三章会讲。）</em></div>
    <div class="eg"><b>Tom <span class="o">can</span> break the cup.</b><em>汤姆能打破杯子。→ 这里 can 在说“能不能”，break 反而退到后面去了。</em></div>
    <p>三个句子里，动词干的活完全不一样。所以学英语语法，第一个要搞清楚的不是“动词有哪些”，而是<b class="k">这个动词在句子里担任什么岗位</b>。</p>

    <h3>动词只有三种活</h3>
    <table class="tbl">
      <tr><th>干的活</th><th>叫什么</th><th>例子</th></tr>
      <tr><td>说“做了什么”</td><td>实义动词（动作）</td><td>He <b>broke</b> the cup.</td></tr>
      <tr><td>说“是什么、怎么样”</td><td>连系动词 / be 动词</td><td>The cup <b>is</b> broken.（当“杯子是破的”讲时）</td></tr>
      <tr><td>说“能不能、该不该、什么时候”</td><td>情态动词 / 助动词</td><td>He <b>can</b> break it. He <b>will</b> break it.</td></tr>
    </table>

    <div class="rule"><div class="rt">最重要的一条</div>
      <p>一个句子只能有<b>一个真正干活</b>的动词（叫谓语动词）。</p>
      <p>如果出现第二个动词，它一定要么变成 <b class="o">to do</b>、<b class="o">doing</b>，要么前面有个帮手（can / will / to）带着它。</p></div>
    <div class="eg x"><b>He can breaks the cup.</b><em>错。can 已经在干活了，break 就必须回到原形。</em></div>
    <div class="eg x"><b>He wants break the cup.</b><em>错。want 后面接动词要加 to：He wants to break the cup.</em></div>
    <div class="eg"><b>He wants to break the cup.</b><em>对。want 干活，break 退成 to break。</em></div>

    <div class="key"><div class="kt">一句话记住</div>
      <p>先找“真动词”，再看别的动词是怎么退到后面的 —— 全书都在练这一件事。</p></div>`,
  quiz:[
    {q:`在 He broke the cup. 这句话里，broke 说的是什么？`,
     o:[`说的是“做了什么事”`,`说的是“什么时候”`,`说的是“能不能”`,`说的是“是什么样”`], a:0,
     w:`broke 是一个动作（打破），属于实义动词。说不清楚一个句子在讲“做什么”，就去把动词找出来。`},
    {q:`The cup is broken. I can't close it. 这句话里，is 的作用是什么？`,
     o:[`表示杯子正在破`,`把“杯子”和“破的”连起来`,`表示杯子将要破`,`说明杯子被别人打破了`], a:1,
     w:`is 在这里不表示动作，它像一个等号，把 the cup 和 broken 连起来，告诉我们杯子“是破的”。这就是连系动词的活。（如果句子里有 by + 人、强调“被打破”，is 就变成被动句的助动词了 —— 第三章细讲。）`},
    {q:`下面哪一句是正确的？`,
     o:[`He can breaking the window.`,`He can to break the window.`,`He can breaks the window.`,`He can break the window.`], a:3,
     w:`can 是情态动词，它后面的动词必须是原形，不加 s、不加 to、不加 ing。这是情态动词的硬规则。`},
    {q:`He wants to break the cup. 里面一共有几个动词？它们分别是什么身份？`,
     o:[`两个：两个都在干活`,`三个：wants、to、break`,`一个：break`,`两个：wants 干活，to break 退到后面`], a:3,
     w:`wants 是真正干活的谓语动词；to break 因为前面有 want，必须变成 to do 的形式跟上去。一个句子只能有一个谓语，其余都要“变形退位”。`},
    {q:`为什么不能说 He wants break the cup.？`,
     o:[`因为 wants 要加 ing`,`因为 break 是不及物动词`,`因为 cup 前面要加 a`,`因为 wants 后面必须跟 to do`], a:3,
     w:`want 这个动词的“脾气”是后面接 to do。不接 to 就变成两个动词硬碰硬，句子散架。这是本册要反复练的一类问题。`}
  ]
},

{
  id:`g2`, ch:`第一章 · 动词的五种岗位`, lv:`基础`, name:`及物动词：后面必须有人接`,
  sub:`及物 = 动作要“落到”一个东西上，否则话说一半`,
  body:`
    <p>有些动作天生要“落到”某个东西上。你打破，一定打破了<b>什么</b>；你打开，一定打开了<b>什么</b>。</p>
    <div class="eg"><b>He broke <span class="k">the cup</span>.</b><em>打破的是 the cup。没有 the cup，这句话就悬在半空。</em></div>
    <div class="eg"><b>She opened <span class="k">the window</span>.</b><em>打开的是 the window。</em></div>
    <p>动作后面接的那个“被动作影响的东西”，叫<b class="k">宾语</b>（object）。动词后面能直接接宾语的，叫<b class="o">及物动词</b>（transitive verb，缩写 vt）。</p>

    <div class="rule"><div class="rt">结构公式</div>
      <p><b>主语 + 及物动词 + 宾语</b></p>
      <p>He broke the cup. &nbsp;/&nbsp; I clean the table. &nbsp;/&nbsp; She can open the door.</p></div>

    <h3>怎么判断是不是及物动词</h3>
    <p>做一个试验：<b>把动词后面拿掉，看句子还立不立得住。</b></p>
    <table class="tbl">
      <tr><th>原句</th><th>拿掉宾语后</th><th>结论</th></tr>
      <tr><td>He broke the cup.</td><td>He broke. ✗</td><td>及物：必须有宾语</td></tr>
      <tr><td>I clean the table.</td><td>I clean. ✗</td><td>及物</td></tr>
      <tr><td>The baby cried.</td><td>The baby cried. ✓</td><td>不及物：不需要宾语（下一课）</td></tr>
    </table>

    <div class="warn"><div class="wt">最容易踩的坑</div>
      <p>中文可以省略宾语：“他打破了。”—— 英语<b>不行</b>：不能说 He broke.</p>
      <p>要么补出宾语（<b>He broke the cup.</b>）；如果想让<b>“杯子”当主语</b>，就得换成<b>被动句</b>：<b>The cup was broken.</b>（第三章专门讲）。</p>
      <p>还有一个坑：宾语要是“宾格”。help <s>I</s> → help <b>me</b>。</p></div>

    <div class="eg x"><b>He broke.</b><em>错。打破什么？话没说完。</em></div>
    <div class="eg x"><b>The cup broke.</b><em>本册别这么写。cup 是“被弄破的东西”，不能让它自己发出“打破”这个动作；要说 The cup was broken.</em></div>

    <div class="key"><div class="kt">一句话记住</div>
      <p>及物动词像投篮，必须投进篮筐（宾语）；不投出去，动作就不完整。</p></div>`,
  quiz:[
    {q:`哪一句里的动词是及物动词？`,
     o:[`They arrived late.`,`She runs fast.`,`He broke the window.`,`The baby cried.`], a:2,
     w:`broke 后面接了 the window 这个宾语，是及物动词。cried、runs、arrived 都不需要宾语，自己就能说完。`},
    {q:`“他打破了。”翻译成英语，下面哪个是对的？`,
     o:[`He is break.`,`He broke it.`,`He broke.`,`He breaks.`], a:1,
     w:`break 是及物动词，后面必须有个东西。it 代替“它”，句子才完整。汉语能省宾语，英语不能。`},
    {q:`I clean the table. 这句话里，the table 是什么成分？`,
     o:[`宾语`,`动词`,`主语`,`形容词`], a:0,
     w:`the table 是动作 clean 落到的东西，叫宾语。主语是最前面那个做动作的人 I。`},
    {q:`下面哪一句结构是“主语 + 及物动词 + 宾语”？`,
     o:[`The baby cried.`,`He is a teacher.`,`Mum cooked dinner.`,`He can swim.`], a:2,
     w:`Mum（主语）+ cooked（及物动词）+ dinner（宾语）。第一句 cried 后面没有宾语；第二句是连系动词；第四句是情态动词加原形。`},
    {q:`help 后面接“我”，应该写哪个？`,
     o:[`help me`,`help mine`,`help my`,`help I`], a:0,
     w:`动词后面是宾语位置，人称代词要用宾格：I 的宾格是 me。同理 he→him，they→them。`},
    {q:`为什么 He broke. 不能算一个完整通顺的句子？`,
     o:[`因为句号不对`,`因为缺主语`,`因为 broke 后面缺宾语，话没说完`,`因为 broke 拼错了`], a:2,
     w:`主语 he 有了，但 broke 是及物动词，需要说明打破了什么。补成 He broke the cup. 才完整。`}
  ]
},

{
  id:`g3`, ch:`第一章 · 动词的五种岗位`, lv:`进阶`, name:`不及物动词：自己就能说完`,
  sub:`不需要宾语；想接东西，得先加一个介词当桥`,
  body:`
    <p>有些动作不需要“落到”别的东西上，自己就成立：哭、跑、来、到达。</p>
    <div class="eg"><b>He <span class="o">sleeps</span>.</b><em>他睡觉。不需要说“睡了什么”，动作自己就说完。</em></div>
    <div class="eg"><b>The baby <span class="o">cried</span>.</b><em>婴儿哭了。</em></div>
    <p>这种后面不接宾语的动词，叫<b class="o">不及物动词</b>（intransitive verb，缩写 vi）。</p>

    <h3>想接东西怎么办？加一个介词当桥</h3>
    <table class="tbl">
      <tr><th>不及物动词</th><th>直接加 ✗</th><th>加介词后 ✓</th></tr>
      <tr><td>run 跑</td><td>run the school ✗</td><td>run <b>to</b> the school ✓</td></tr>
      <tr><td>arrive 到达</td><td>arrive the station ✗</td><td>arrive <b>at</b> the station ✓</td></tr>
      <tr><td>listen 听</td><td>listen me ✗</td><td>listen <b>to</b> me ✓</td></tr>
      <tr><td>look 看</td><td>look the picture ✗</td><td>look <b>at</b> the picture ✓</td></tr>
    </table>
    <div class="tip"><b>注意：</b>加上介词以后，后面那个东西严格来说叫“介词宾语”，不再是动词的宾语。所以动不了被动语态 —— 这一点第三章会用到。</div>

    <h3>那“杯子破了”到底怎么说？</h3>
    <p>看这两句，说的是同一件事，但<b>站在谁的角度说</b>不一样：</p>
    <table class="tbl">
      <tr><th>谁在句子里当主语</th><th>该怎么写</th><th>例子</th></tr>
      <tr><td>动手的人</td><td>主语 + 动词 + 宾语（主动）</td><td>Tom <b>broke</b> the cup.</td></tr>
      <tr><td>被弄的东西</td><td>主语 + be + 过去分词（被动）</td><td>The cup <b>was broken</b> (by Tom).</td></tr>
    </table>
    <div class="rule"><div class="rt">规律</div>
      <p>主语从“动手的人”换成“被弄的东西”，动词<b>不能原样搬过去</b>，必须变成 <b>be + 过去分词</b>。</p>
      <p>所以 <s>The cup broke.</s> 不要写，要写 <b>The cup was broken.</b> 这就是第三章要学的<b>被动语态</b>，现在先记住方向。</p></div>

    <div class="warn"><div class="wt">坑</div>
      <p>① 不及物动词没有宾语，所以<b>不能变被动</b>：He arrived the station 是错的，was arrived 也是错的。</p>
      <p>② 反过来，只有句子里<b>本来就有宾语</b>，才提得出来当主语、才变得了被动。判断第一步永远是：有没有宾语。</p></div>

    <div class="tip"><b>给家长 / 老师的小注：</b>真实英语里确实存在 “The cup broke.” / “The door opened.” 这类说法（语法上叫<b>作格动词</b> / ergative verb，表示东西自己发生了变化），母语者日常会用，它不是错句。但小学教材和考试一律要求写成 <b>be + 过去分词</b>，本册统一按这个口径教；等孩子把被动句走稳了，以后再补这个例外，免得现在两套规则打架。</div>

    <div class="key"><div class="kt">一句话记住</div>
      <p>不及物动词自己就能说完；想接东西，先架一座介词桥。</p></div>`,
  quiz:[
    {q:`想说“杯子被打破了”，下面哪一句是本册要学的写法？`,
     o:[`The cup was broken.`,`The cup broke.`,`The cup is break.`,`The cup broken.`], a:0,
     w:`主语 cup 是“被弄的东西”，要用 be + 过去分词：was broken。这是第三章的被动语态，现在先记住别把 broke 直接搬过去；少了 be 的 The cup broken. 也不成立。`},
    {q:`“听我说”用英语怎么说是对的？`,
     o:[`Listen to me.`,`Listen for me.`,`Listen me.`,`Listen at me.`], a:0,
     w:`listen 是不及物动词，不能直接接宾语，要加介词 to 当桥：listen to me。`},
    {q:`下面哪一句是错的？`,
     o:[`He runs to school.`,`He arrived at the station.`,`He looks at the picture.`,`He arrived the station.`], a:3,
     w:`arrive 是不及物动词，接地点要加 at（大地点用 in）：arrive at the station。少这个介词就错了。`},
    {q:`不及物动词后面想接东西，应该怎么办？`,
     o:[`直接加宾语`,`把动词变成过去分词`,`在动词前面加 be`,`先加一个介词当桥`], a:3,
     w:`listen to me / arrive at the station / look at the picture —— 不及物动词要接东西，先架一座介词桥。直接加宾语、或者硬加 be，都是错的。`},
    {q:`为什么不能说 The baby was cried？`,
     o:[`因为 baby 是单数`,`因为 cry 的过去式写错了`,`因为时态不对`,`因为 cry 是不及物动词，没有宾语，变不了被动`], a:3,
     w:`被动语态的本质是“把宾语提到前面当主语”。不及物动词根本没有宾语，所以没有东西可以提上来，也就没有被动式。`},
    {q:`He runs fast. 里 fast 是什么？`,
     o:[`表语`,`主语`,`宾语`,`状语（说明怎么跑）`], a:3,
     w:`fast 说明“跑得快”，回答“怎么跑”，属于状语。它既不是动作落到的东西，也不是描述主语的样子，所以不改变 runs 的不及物性质。`}
  ]
},

{
  id:`g4`, ch:`第一章 · 动词的五种岗位`, lv:`进阶`, name:`连系动词：一个等号`,
  sub:`它不是动作，是把“谁”和“什么样”连起来`,
  body:`
    <p>看这句话：<b>The soup is hot.</b> is 没有“做”任何事，它只是一个等号：汤 = 热的。</p>
    <div class="eg"><b>The soup <span class="o">is</span> hot.</b><em>汤是热的。is 后面跟形容词，说明主语什么样。</em></div>
    <div class="eg"><b>He <span class="o">is</span> a teacher.</b><em>他是一名老师。is 后面跟名词，说明主语是谁。</em></div>
    <p>这种像等号一样、把主语和后面的说明连起来的动词，叫<b class="o">连系动词</b>（linking verb）。后面的那部分叫<b class="k">表语</b>（predicative）。</p>

    <h3>连系动词全家</h3>
    <table class="tbl">
      <tr><th>成员</th><th>意思</th><th>例子</th></tr>
      <tr><td>be（am / is / are / was / were）</td><td>是</td><td>She <b>is</b> happy.</td></tr>
      <tr><td>look</td><td>看起来</td><td>You <b>look</b> tired.</td></tr>
      <tr><td>sound</td><td>听起来</td><td>That <b>sounds</b> good.</td></tr>
      <tr><td>smell</td><td>闻起来</td><td>The flowers <b>smell</b> nice.</td></tr>
      <tr><td>taste</td><td>尝起来</td><td>The soup <b>tastes</b> good.</td></tr>
      <tr><td>feel</td><td>感觉</td><td>I <b>feel</b> cold.</td></tr>
      <tr><td>get / become / turn</td><td>变得</td><td>It <b>is getting</b> dark. The leaves <b>turn</b> yellow.</td></tr>
    </table>

    <div class="rule"><div class="rt">规律</div>
      <p>连系动词后面跟的是<b>形容词</b>或<b>名词</b>，不是副词，也不是动作。</p>
      <p>因为它在描述“什么样”，不是在描述“怎么做”。</p></div>
    <div class="eg x"><b>He looks happily.</b><em>错。look 在这里是连系动词，后面要形容词 happy。</em></div>
    <div class="eg"><b>He looks happy.</b><em>对。他看起来很开心。</em></div>

    <h3>怎么和“动作”区分</h3>
    <p>同一个词，可能是连系动词，也可能是普通动作动词，看它后面跟什么：</p>
    <table class="tbl">
      <tr><th>句子</th><th>look 的身份</th><th>为什么</th></tr>
      <tr><td>He <b>looks</b> happy.</td><td>连系动词</td><td>后面是形容词 happy，在说“他什么样”</td></tr>
      <tr><td>He <b>looks</b> at the picture.</td><td>动作动词（不及物）</td><td>后面是介词 at，在说“他看”这个动作</td></tr>
    </table>

    <div class="warn"><div class="wt">两个坑</div>
      <p>① be 动词后面不能直接跟动词原形：He <s>is go</s> → He <b>goes</b> 或 He <b>is going</b>。</p>
      <p>② 连系动词也要跟主语配合：The flowers <s>smells</s> nice → The flowers <b>smell</b> nice。</p></div>

    <div class="key"><div class="kt">一句话记住</div>
      <p>连系动词 = 等号。等号后面跟“什么样”，不跟“怎么做”。</p></div>`,
  quiz:[
    {q:`下面哪个词不是连系动词？`,
     o:[`break`,`look`,`smell`,`become`], a:0,
     w:`break 是实义动词，表示“打破”这个动作。look、smell、become 都可以当连系动词，后面接形容词或名词。`},
    {q:`“他看起来很累”应该怎么写？`,
     o:[`He look tired.`,`He looks tired.`,`He looks tire.`,`He looks tiredly.`], a:1,
     w:`look 在这里是连系动词，后面接形容词 tired。加 -ly 变成副词就错了；主语是 he，look 要加 s。`},
    {q:`The flowers smell nice. 这句话里 nice 是什么成分？`,
     o:[`主语`,`宾语`,`表语`,`状语`], a:2,
     w:`smell 是连系动词，nice 说明花“闻起来怎么样”，是表语。它回答的是“什么样”，不是“怎么做”。`},
    {q:`He looks at the picture. 里的 looks 是什么动词？`,
     o:[`情态动词`,`动作动词（不及物）`,`助动词`,`连系动词`], a:1,
     w:`后面跟的是介词 at，说明他在“看”这个动作，不是描述他什么样。同一个 look，后面跟什么决定了它的身份。`},
    {q:`It is getting dark. 这句话里的 getting 表示什么？`,
     o:[`打破`,`变得`,`拿到`,`到达`], a:1,
     w:`get 在这里是连系动词，意思是“变得”，后面跟形容词 dark。get 还能表示“得到”，那要看后面跟的是名词还是形容词。`},
    {q:`下面哪一句是错的？`,
     o:[`The soup is taste good.`,`The soup tastes good.`,`The soup smells good.`,`The soup is hot.`], a:0,
     w:`is 和 taste 都是动词，不能两个硬凑在一起。要么 The soup tastes good.（taste 自己当连系动词），要么 The soup is good.`}
  ]
},

{
  id:`g5`, ch:`第一章 · 动词的五种岗位`, lv:`进阶`, name:`情态动词：只表态度的帮手`,
  sub:`can / must / should / may —— 后面永远跟原形`,
  body:`
    <p>He breaks the cup. 是“他打破”。He <b class="o">can</b> break the cup. 是“他<b>能</b>打破”。</p>
    <p>can 没有替换 break，它只是加了一个“态度”：能不能、该不该、可不可以。这就是<b class="o">情态动词</b>（modal verb）。</p>

    <h3>四个常用成员</h3>
    <table class="tbl">
      <tr><th>情态动词</th><th>意思</th><th>例子</th></tr>
      <tr><td>can / can't</td><td>能 / 不能</td><td>I <b>can</b> swim. I <b>can't</b> swim.</td></tr>
      <tr><td>must / mustn't</td><td>必须 / 绝对不许</td><td>You <b>must</b> go. You <b>mustn't</b> touch it.</td></tr>
      <tr><td>should / shouldn't</td><td>应该 / 不应该</td><td>You <b>should</b> sleep early.</td></tr>
      <tr><td>may</td><td>可以、也许</td><td>You <b>may</b> go now.</td></tr>
    </table>

    <div class="rule"><div class="rt">情态动词三条铁律</div>
      <p>① <b>不变形</b>：没有第三人称单数，不加 s。He can ✓ &nbsp; He cans ✗</p>
      <p>② <b>后面跟动词原形</b>：can break ✓ &nbsp; can breaks ✗ &nbsp; can to break ✗ &nbsp; can breaking ✗</p>
      <p>③ <b>否定和疑问直接自己上</b>：不需要 do。</p></div>
    <div class="eg"><b>He can break it.</b><em>他能打破它。can 不变，break 原形。</em></div>
    <div class="eg"><b>Can he break it?</b><em>问句把 can 提到最前面，不加 do。</em></div>
    <div class="eg x"><b>Does he can break it?</b><em>错。can 自己就能提问，不需要 do 再来帮忙。</em></div>

    <h3>must 的两个否定，一定要分清</h3>
    <table class="tbl">
      <tr><th>想说</th><th>用</th><th>例子</th></tr>
      <tr><td>不必（否定“必须”）</td><td>needn't / don't have to</td><td>You <b>needn't</b> go.</td></tr>
      <tr><td>绝对不许（否定“做这件事”）</td><td>mustn't</td><td>You <b>mustn't</b> go.</td></tr>
    </table>
    <p>问句也一样：<b>Must I go? — No, you needn't.</b>（回答不能用 mustn't，那是“不许你去”。）</p>

    <div class="key"><div class="kt">一句话记住</div>
      <p>情态动词是“态度”，不动手；动手的永远是后面那个原形。</p></div>`,
  quiz:[
    {q:`下面哪一句是正确的？`,
     o:[`He cans swim.`,`He can to swim.`,`He can swim.`,`He can swims.`], a:2,
     w:`情态动词不变形（不加 s），后面跟动词原形（不加 s、不加 to）。所以只能是 He can swim.`},
    {q:`把 He can break it. 变成问句，应该怎么写？`,
     o:[`Is he can break it?`,`He can break it?`,`Does he can break it?`,`Can he break it?`], a:3,
     w:`情态动词自己就能提到句首提问，不需要 do。加 do 反而重复了。`},
    {q:`“你不必去”用英语怎么说？`,
     o:[`You needn't go.`,`You can't go.`,`You mustn't go.`,`You don't go.`], a:0,
     w:`“不必”是否定“必须”，用 needn't（或 don't have to）。mustn't 是“绝对不许去”，意思正好相反。`},
    {q:`Must I go now? 的否定回答是哪个？`,
     o:[`No, you mustn't.`,`No, you needn't.`,`No, you can't.`,`No, you don't.`], a:1,
     w:`这是固定考点：Must I …? 的否定回答永远是 No, you needn't. 答 mustn't 就变成“不许你去”，答非所问。`},
    {q:`情态动词后面可以跟下面哪种形式？`,
     o:[`动词加 ing`,`动词原形`,`动词加 s`,`to 加动词`], a:1,
     w:`情态动词后面永远是原形。这也是为什么 He can breaks 这类错误特别常见 —— 主语是三单，hand 会顺手加 s，但 can 后面不许加。`},
    {q:`You should sleep early. 里的 should 表示什么？`,
     o:[`将要`,`必须`,`能够`,`应该`], a:3,
     w:`should 表示建议、应该。它和 can（能）、must（必须）、will（将要）是同一个家族，后面都跟原形。`}
  ]
},

{
  id:`g6`, ch:`第一章 · 动词的五种岗位`, lv:`进阶`, name:`助动词：不翻译的工具人`,
  sub:`do / does / did / will / have —— 它们出场只为帮别人造句`,
  body:`
    <p>看这两句：</p>
    <div class="eg"><b>I <span class="o">do</span> my homework.</b><em>这里的 do 是“做”，有实际意思，是实义动词。</em></div>
    <div class="eg"><b>I <span class="o">do</span> not break the cup.</b><em>这里的 do 没有“做”的意思，它只是帮 not 站住脚。这就是助动词。</em></div>
    <p><b class="o">助动词</b>（auxiliary verb）就是“帮忙的动词”：它自己几乎没有意思，专门负责扛否定、扛疑问、扛时间。</p>

    <h3>四个常用助动词</h3>
    <table class="tbl">
      <tr><th>助动词</th><th>帮什么忙</th><th>例子</th></tr>
      <tr><td>do / does / did</td><td>否定句、疑问句</td><td>He <b>doesn't</b> break it. <b>Did</b> he break it?</td></tr>
      <tr><td>will</td><td>将来</td><td>He <b>will</b> break it.</td></tr>
      <tr><td>have / has</td><td>完成时</td><td>He <b>has</b> broken it.</td></tr>
      <tr><td>be（am/is/are）</td><td>进行时、被动</td><td>He <b>is</b> breaking it. It <b>is</b> broken.</td></tr>
    </table>

    <div class="rule"><div class="rt">助动词一上场，后面动词就“交出权力”</div>
      <p>does / did / will / have 一旦出现，后面的动词就要变成规定形式：</p>
      <p>does + <b>原形</b> &nbsp;|&nbsp; did + <b>原形</b> &nbsp;|&nbsp; will + <b>原形</b> &nbsp;|&nbsp; have + <b>过去分词</b> &nbsp;|&nbsp; be + <b>ing / 过去分词</b></p></div>
    <div class="eg x"><b>He doesn't breaks it.</b><em>错。does 已经在扛三单了，break 必须回原形。</em></div>
    <div class="eg"><b>He doesn't break it.</b><em>对。</em></div>
    <div class="eg x"><b>Did he broke it?</b><em>错。did 已经表示过去，break 回原形。</em></div>
    <div class="eg"><b>Did he break it?</b><em>对。一句话里“过去”只标一次。</em></div>

    <h3>一个特别好用的判断法</h3>
    <p>看到句子里的动词有两个，先问：<b>前面那个是情态动词还是助动词？</b></p>
    <p>是的话，后面那个一定是原形（除了 have + 过去分词、be + ing）。这就是“一个句子里过去、三单只能标一次”的道理。</p>

    <div class="key"><div class="kt">一句话记住</div>
      <p>助动词不翻译，只帮忙；它一出现，后面的动词就变形让位。</p></div>`,
  quiz:[
    {q:`下面哪一句里的 do 是助动词？`,
     o:[`I do not like it.`,`I do the dishes.`,`I do it now.`,`I do my homework.`], a:0,
     w:`do not 里的 do 没有“做”的意思，只是帮 not 站住脚，是助动词。其余三句的 do 都是“做”这个实义动作。`},
    {q:`下面哪一句是正确的？`,
     o:[`He don't break the cup.`,`He doesn't break the cup.`,`He doesn't breaks the cup.`,`He not break the cup.`], a:1,
     w:`主语 he 用 doesn't；does 已经扛了三单，break 回原形。don't 只配 I / you / we / they。`},
    {q:`Did he break the cup? 为什么 break 不用过去式？`,
     o:[`因为 he 是第三人称`,`因为 break 没有过去式`,`因为 did 已经表示过去了`,`因为问句里不用过去式`], a:2,
     w:`did 本身就是过去式助动词，过去的标记只能出现一次。所以 did + 原形：Did he break it? 不能说 Did he broke it?`},
    {q:`He has broken the cup. 里的 has 帮的是什么忙？`,
     o:[`否定`,`疑问`,`完成时`,`被动`], a:2,
     w:`has + 过去分词 → 现在完成时（第 12 课细讲）。has 在这里不表示“有”，是助动词。`},
    {q:`He will break the cup. 变成否定句，应该是？`,
     o:[`He will not breaks the cup.`,`He not will break the cup.`,`He doesn't will break the cup.`,`He will not break the cup.`], a:3,
     w:`will 自己加 not 就完成否定，不需要 do；后面的 break 保持原形。`},
    {q:`哪些词属于助动词家族？`,
     o:[`can、must、should`,`break、open、clean`,`happy、tired、dark`,`do、will、have、be`], a:3,
     w:`do/will/have/be 是助动词，自己不表意，专职帮忙造否定、疑问、时态、语态。can/must/should 是情态动词，另一族。`}
  ]
},

{
  id:`g7`, ch:`第一章 · 动词的五种岗位`, lv:`巩固`, name:`四步判定：这个词在这里算什么`,
  sub:`拿到任何一个动词，四问就能定位`,
  body:`
    <p>前面五课认识了五类动词。真实句子里，同一个词可能属于不同类，所以重点不是背类别，而是<b class="k">会判定</b>。</p>

    <h3>四步判定法</h3>
    <div class="rule"><div class="rt">按顺序问四个问题</div>
      <p><b>第 1 问：</b>它后面跟的是形容词/名词，而且在说主语“什么样”吗？→ 是，就是<b>连系动词</b>。</p>
      <p><b>第 2 问：</b>它后面紧跟动词原形，而且表示能不能、该不该？→ 是，就是<b>情态动词</b>。</p>
      <p><b>第 3 问：</b>它自己不表意，只帮着造否定/疑问/时态？→ 是，就是<b>助动词</b>。</p>
      <p><b>第 4 问：</b>它在说一个动作。那它后面有没有直接跟宾语？→ 有，<b>及物</b>；没有，<b>不及物</b>。</p></div>

    <h3>练一遍</h3>
    <table class="tbl">
      <tr><th>句子</th><th>目标词</th><th>判定</th><th>依据</th></tr>
      <tr><td>He <b>is</b> tired.</td><td>is</td><td>连系动词</td><td>后面是形容词，说“他什么样”</td></tr>
      <tr><td>He <b>can</b> swim.</td><td>can</td><td>情态动词</td><td>后面跟原形，表示“能”</td></tr>
      <tr><td>He <b>does</b> not swim.</td><td>does</td><td>助动词</td><td>自己没意思，只帮 not</td></tr>
      <tr><td>He <b>broke</b> the cup.</td><td>broke</td><td>及物动词</td><td>后面直接跟宾语 the cup</td></tr>
      <tr><td>The baby <b>cried</b>.</td><td>cried</td><td>不及物动词</td><td>后面没有宾语，自己说完</td></tr>
      <tr><td>The cup <b>is</b> broken.</td><td>is</td><td>两种可能：被动助动词 / 连系动词</td><td>强调“被打破”是被动；只说“是破的”是连系。看 by 短语和上下文，第三章细讲</td></tr>
    </table>

    <div class="tip"><b>同一个 is，两种身份：</b>He is tired. 后面是形容词，is 是<b>连系动词</b>；The cup is broken. 后面是过去分词 broken，可能是<b>被动句的助动词</b>（杯子被打破了），也可能只是描述状态（杯子是破的）。单看一句分不清，要看有没有 by 短语和上下文 —— 第三章第 17 课专门讲这个。</div>

    <div class="warn"><div class="wt">小结：常见的错配</div>
      <p>情态动词后加了 s：He <s>cans</s> → He <b>can</b></p>
      <p>助动词后又标三单：He doesn't <s>breaks</s> → He doesn't <b>break</b></p>
      <p>连系动词后跟副词：He looks <s>happily</s> → He looks <b>happy</b></p>
      <p>及物动词不带宾语：He <s>broke</s>. → He broke <b>the cup</b>.</p></div>

    <div class="key"><div class="kt">一句话记住</div>
      <p>先看后面跟什么，再定它是什么 —— 词性由位置决定，不由单词决定。</p></div>`,
  quiz:[
    {q:`The soup is hot. 里的 is 属于哪一类？`,
     o:[`及物动词`,`助动词`,`情态动词`,`连系动词`], a:3,
     w:`后面跟形容词 hot，说明汤“是热的”，像等号，所以是连系动词。`},
    {q:`He does not like coffee. 里的 does 属于哪一类？`,
     o:[`情态动词`,`助动词`,`连系动词`,`不及物动词`], a:1,
     w:`does 自己没意思，只帮着造否定，是助动词。它一出现，后面的 like 就用原形。`},
    {q:`She can dance. 里的 dance 是什么形式？为什么？`,
     o:[`原形，因为 can 后面必须是原形`,`ing 形式，因为正在进行`,`三单形式，因为 she`,`过去式，因为动作发生过`], a:0,
     w:`can 是情态动词，后面一律跟原形。she 虽然是第三人称单数，但三单的 s 是加在谓语动词上的，这里谓语是 can，can 不变。`},
    {q:`The baby cried. 里的 cried 是及物还是不及物？`,
     o:[`助动词`,`连系动词`,`及物，因为后面有 the baby`,`不及物，因为 cried 后面没有宾语`], a:3,
     w:`the baby 是主语，不是宾语。cried 后面没有东西，句子自己说完，所以是不及物用法。`},
    {q:`下面的判定，哪一个是错的？`,
     o:[`He has broken it. → has 是助动词`,`He broke it. → broke 是不及物动词`,`He is a teacher. → is 是连系动词`,`He must go. → must 是情态动词`], a:1,
     w:`He broke it. 里 broke 后面直接跟宾语 it，是及物动词。判断及物不及物，就看后面有没有宾语。`},
    {q:`为什么说“词性由位置决定”？`,
     o:[`因为词性会随时态变化`,`因为同一个词在不同句子里可以是不同类`,`因为每个词只有一个词性`,`因为英语没有词性`], a:1,
     w:`look 可以是连系动词（looks happy），也可以是动作动词（looks at the picture）；is 在 He is tired. 里是连系动词，在 The cup was broken. 里是被动句的助动词。所以判定要看它在句子里的位置和后面跟什么，而不是背单词表。`}
  ]
},
/* ============ 第二章 · 时态 ============ */
{
  id:`g8`, ch:`第二章 · 五个时态`, lv:`基础`, name:`时态是两把尺子量出来的`,
  sub:`时间（现在/过去/将来）× 状态（一般/进行/完成）`,
  body:`
    <p>很多同学以为“时态”就是“时间”，其实它是<b class="k">两件事拼起来</b>：</p>
    <div class="rule"><div class="rt">时态 = 时间 + 状态</div>
      <p><b>时间</b>有三种：现在、过去、将来。</p>
      <p><b>状态</b>有三种：一般（就说这件事）、进行（正在做）、完成（做完了，和现在有关）。</p></div>
    <p>两把尺子交叉，就有了不同的时态。初中主要学 8 种，本册先学最常用的 5 种：</p>
    <table class="tbl">
      <tr><th>状态＼时间</th><th>现在</th><th>过去</th><th>将来</th></tr>
      <tr><td><b>一般</b></td><td class="hl">一般现在时</td><td class="hl">一般过去时</td><td class="hl">一般将来时</td></tr>
      <tr><td><b>进行</b></td><td class="hl">现在进行时</td><td>过去进行时（以后学）</td><td>—</td></tr>
      <tr><td><b>完成</b></td><td class="hl">现在完成时</td><td>过去完成时（以后学）</td><td>—</td></tr>
    </table>

    <h3>先看同一个动词的五个样子</h3>
    <p>全书只用一个动词 <b class="o">break</b>（打破），看它怎么变：</p>
    <table class="tbl">
      <tr><th>时态</th><th>形式</th><th>例句</th><th>在说什么</th></tr>
      <tr><td>一般现在</td><td>break / breaks</td><td>He <b>breaks</b> cups.</td><td>他（经常）打破杯子</td></tr>
      <tr><td>现在进行</td><td>is breaking</td><td>He <b>is breaking</b> a cup.</td><td>他正在打破杯子</td></tr>
      <tr><td>一般过去</td><td>broke</td><td>He <b>broke</b> a cup.</td><td>他（昨天）打破了杯子</td></tr>
      <tr><td>现在完成</td><td>has broken</td><td>He <b>has broken</b> a cup.</td><td>他把杯子打破了（现在杯子是破的）</td></tr>
      <tr><td>一般将来</td><td>will break</td><td>He <b>will break</b> a cup.</td><td>他（明天）会打破杯子</td></tr>
    </table>

    <div class="tip"><b>看出来了吗：</b>变的只是动词前面那一小块（breaks / is / broke / has / will），后面的 break 要么回原形，要么变 ing，要么变过去分词。所以学时态，先盯住<b>前面那个“信号灯”</b>。</div>

    <div class="key"><div class="kt">一句话记住</div>
      <p>先问“什么时候”，再问“做完了没有、正在做没有”，答案就是时态。</p></div>`,
  quiz:[
    {q:`时态是由哪两件事决定的？`,
     o:[`动词和名词`,`时间和状态`,`主语和宾语`,`单数和复数`], a:1,
     w:`时间（现在/过去/将来）× 状态（一般/进行/完成），两把尺子交叉才定出一个时态。只记时间会漏掉“进行”和“完成”。`},
    {q:`He breaks cups. 这个句子表示什么？`,
     o:[`他已经打破了杯子`,`他正在打破杯子`,`他经常打破杯子`,`他将会打破杯子`], a:2,
     w:`breaks 是一般现在时，表示经常性、习惯性的动作。正在做要用 is breaking，已经打破要用 has broken。`},
    {q:`He is breaking a cup. 里的 is 起什么作用？`,
     o:[`表示“是”`,`表示将来`,`帮动词扛“正在”`,`表示过去`], a:2,
     w:`进行时 = be + doing。be 负责跟主语配合（he → is），doing 负责表示“正在”。两个零件分工明确。`},
    {q:`He has broken a cup. 强调的是什么？`,
     o:[`他正在打破杯子`,`打破这件事发生在过去，但现在杯子是破的`,`他每天都打破杯子`,`杯子将要在未来破`], a:1,
     w:`现在完成时的重点是“过去做的事，对现在有影响”。至于什么时候打破的，句子并不关心。`},
    {q:`下面哪一组是“同一个动词的三种形式”？`,
     o:[`break、breaks、breaking`,`break、can、will`,`break、cup、window`,`break、broke、broken`], a:3,
     w:`break（原形）— broke（过去式）— broken（过去分词），这是动词的“三态”。原形加 s 或加 ing 属于变形，不算三态。`},
    {q:`看到句子里有 will，说明这个句子在说什么时间？`,
     o:[`不确定`,`将来`,`现在`,`过去`], a:1,
     w:`will 是将来时的信号。类似的时间信号还有 be going to。看到它就知道动作还没发生。`}
  ]
},

{
  id:`g9`, ch:`第二章 · 五个时态`, lv:`基础`, name:`一般现在时：习惯和事实`,
  sub:`天天如此、一向如此的事，用这个时态`,
  body:`
    <p>什么时候用？三种情况：</p>
    <div class="eg"><b>He <span class="o">breaks</span> a cup every week.</b><em>他每周都打破杯子。→ 习惯</em></div>
    <div class="eg"><b>Water <span class="o">boils</span> at 100°C.</b><em>水在 100 度沸腾。→ 事实、真理</em></div>
    <div class="eg"><b>I <span class="o">like</span> apples.</b><em>我喜欢苹果。→ 一直以来的喜好</em></div>

    <h3>形式：看主语是谁</h3>
    <table class="tbl">
      <tr><th>主语</th><th>动词</th><th>例子</th></tr>
      <tr><td>I / you / we / they / 复数</td><td>原形</td><td>They <b>break</b> cups.</td></tr>
      <tr><td>he / she / it / 单数</td><td>原形 + s</td><td>He <b>breaks</b> cups.</td></tr>
      <tr><td>be 动词</td><td>am / is / are</td><td>He <b>is</b> happy.</td></tr>
    </table>
    <p><b>加 s 的规则：</b>一般 +s（breaks）；s/x/ch/sh/o 结尾 +es（watches, goes）；辅音字母+y 改 ies（studies）；have → has。</p>

    <h3>否定和疑问：请 do / does 出场</h3>
    <div class="rule"><div class="rt">公式</div>
      <p>否定：主语 + <b>don't / doesn't</b> + 原形 &nbsp;&nbsp; He <b>doesn't break</b> cups.</p>
      <p>疑问：<b>Do / Does</b> + 主语 + 原形？ &nbsp;&nbsp; <b>Does</b> he <b>break</b> cups?</p>
      <p>简答：Yes, he <b>does</b>. / No, he <b>doesn't</b>.</p></div>
    <div class="warn"><div class="wt">坑</div>
      <p>does 已经扛了三单，后面的动词<b>必须回原形</b>：He doesn't <s>breaks</s> → He doesn't <b>break</b>。</p>
      <p>be 动词不需要 do 帮忙：He <s>doesn't is</s> → He <b>isn't</b> happy。</p></div>

    <h3>常见时间标志词</h3>
    <p>every day / every week &nbsp;·&nbsp; usually &nbsp;·&nbsp; often &nbsp;·&nbsp; always &nbsp;·&nbsp; sometimes &nbsp;·&nbsp; never &nbsp;·&nbsp; on Sundays</p>
    <p>看到这些词，基本就是这个时态。</p>

    <div class="key"><div class="kt">一句话记住</div>
      <p>一般现在时管“老是这样”的事；主语是三单，动词就戴一顶 s 的帽子。</p></div>`,
  quiz:[
    {q:`My sister ______ to school every day. 应该填什么？`,
     o:[`goes`,`went`,`going`,`go`], a:0,
     w:`every day 说明是一般现在时；主语 my sister 是第三人称单数，动词要加 s（go → goes）。`},
    {q:`下面哪一句是正确的？`,
     o:[`He doesn't like coffee.`,`He don't like coffee.`,`He doesn't likes coffee.`,`He not like coffee.`], a:0,
     w:`主语 he 用 doesn't；does 已经表示三单，后面的 like 必须回原形。`},
    {q:`把 She cleans the table. 变成一般疑问句，应该是？`,
     o:[`Is she clean the table?`,`Does she clean the table?`,`Does she cleans the table?`,`Do she clean the table?`], a:1,
     w:`用 Does 提问（she 是三单），后面动词回原形 clean。`},
    {q:`Water ______ at 100°C. 这句话为什么用一般现在时？`,
     o:[`因为说的是客观事实`,`因为水昨天沸腾了`,`因为水正在沸腾`,`因为水明天会沸腾`], a:0,
     w:`客观真理、自然规律永远用一般现在时，即使说的是“任何时间”都成立的事。`},
    {q:`下面哪个词最可能出现在一般现在时的句子里？`,
     o:[`tomorrow`,`yesterday`,`now`,`usually`], a:3,
     w:`usually（通常）表示习惯，是一般现在时的典型标志。yesterday 配过去时，now 配进行时，tomorrow 配将来时。`},
    {q:`They ______ football on Sundays. 应该填什么？`,
     o:[`is play`,`plays`,`playing`,`play`], a:3,
     w:`主语 they 是复数，动词用原形 play。plays 是给 he/she/it 用的。`}
  ]
},

{
  id:`g10`, ch:`第二章 · 五个时态`, lv:`基础`, name:`现在进行时：此刻正在做`,
  sub:`be + doing，两个零件各管一件事`,
  body:`
    <p>Look! He <b class="o">is breaking</b> a cup. —— 就在你眼前发生，用现在进行时。</p>

    <h3>为什么一个句子里有两个动词</h3>
    <p>这是很多人小时候最困惑的地方：既有 be，又有 doing，到底谁是动词？</p>
    <div class="rule"><div class="rt">分工表</div>
      <p><b>be</b>（am / is / are）：负责跟主语配合，扛“是谁”。</p>
      <p><b>doing</b>（动词 + ing）：负责表示“正在”。</p>
      <p>两个零件拼起来，才等于中文里的一个“正在”。</p></div>
    <div class="eg"><b>I <span class="o">am</span> break<span class="o">ing</span> a cup.</b><em>am 配 I，ing 表示正在。</em></div>
    <div class="eg"><b>He <span class="o">is</span> break<span class="o">ing</span> a cup.</b><em>is 配 he。</em></div>
    <div class="eg"><b>They <span class="o">are</span> break<span class="o">ing</span> cups.</b><em>are 配 they。</em></div>

    <h3>动词加 ing 的三条规则</h3>
    <table class="tbl">
      <tr><th>情况</th><th>怎么变</th><th>例子</th></tr>
      <tr><td>一般</td><td>直接 +ing</td><td>break → break<b>ing</b></td></tr>
      <tr><td>以不发音 e 结尾</td><td>去 e 再 +ing</td><td>make → mak<b>ing</b>，dance → danc<b>ing</b></td></tr>
      <tr><td>重读闭音节、末尾只有一个辅音</td><td>双写再加 ing</td><td>run → ru<b>nn</b>ing，swim → swi<b>mm</b>ing</td></tr>
    </table>

    <h3>否定和疑问</h3>
    <div class="rule"><div class="rt">公式</div>
      <p>否定：主语 + be + <b>not</b> + doing &nbsp;&nbsp; He <b>isn't</b> breaking it.</p>
      <p>疑问：<b>Be</b> + 主语 + doing？ &nbsp;&nbsp; <b>Is</b> he breaking it?</p>
      <p>简答：Yes, he <b>is</b>. / No, he <b>isn't</b>. （不用 do）</p></div>

    <h3>和一般现在时比一比</h3>
    <table class="tbl">
      <tr><th></th><th>一般现在时</th><th>现在进行时</th></tr>
      <tr><td>管什么</td><td>经常、习惯</td><td>此刻正在</td></tr>
      <tr><td>例子</td><td>He <b>breaks</b> cups.</td><td>He <b>is breaking</b> a cup.</td></tr>
      <tr><td>标志词</td><td>every day, usually</td><td>now, look, listen, at the moment</td></tr>
    </table>

    <div class="warn"><div class="wt">坑</div>
      <p>① 别丢 be：He <s>breaking</s> a cup → He <b>is breaking</b> a cup.</p>
      <p>② 别在 ing 上再加 s：He is <s>breaksing</s> → He is <b>breaking</b>.</p>
      <p>③ like / want / know 这类表示“状态”的动词，一般不用进行时：I <s>am liking</s> it → I <b>like</b> it.</p></div>

    <div class="key"><div class="kt">一句话记住</div>
      <p>be 管“是谁”，ing 管“正在”，两个合起来才是“正在做”。</p></div>`,
  quiz:[
    {q:`Look! The baby ______ . 应该填什么？`,
     o:[`cry`,`cries`,`is crying`,`cried`], a:2,
     w:`Look! 提示“此刻正在”，用现在进行时：is crying。主语 the baby 是单数，配 is。`},
    {q:`下面哪一句是正确的？`,
     o:[`He is breaking the cup.`,`He breaking the cup.`,`He is break the cup.`,`He is breaks the cup.`], a:0,
     w:`进行时必须是 be + doing。缺 be 不行，ing 后面再加 s 也不行。`},
    {q:`make 变成进行时形式，应该是？`,
     o:[`making`,`makesing`,`makking`,`makeing`], a:0,
     w:`以不发音的 e 结尾，去掉 e 再加 ing：make → making。dance → dancing 同理。`},
    {q:`把 They are playing. 变成否定句，应该是？`,
     o:[`They not playing.`,`They isn't playing.`,`They aren't playing.`,`They don't playing.`], a:2,
     w:`进行时的否定是在 be 后面加 not：are not = aren't。主语 they 配 are，不是 is。`},
    {q:`下面哪个词最可能出现在现在进行时的句子里？`,
     o:[`every day`,`now`,`yesterday`,`last week`], a:1,
     w:`now（现在）是进行时最典型的标志。every day 配一般现在时，yesterday 和 last week 配过去时。`},
    {q:`为什么不能说 I am liking this book.？`,
     o:[`因为 book 是可数名词`,`因为 like 后面不能跟宾语`,`因为 I 后面不能用 am`,`因为 like 表示状态，一般不用进行时`], a:3,
     w:`like、want、know、have（拥有）这类词表示“状态”，不是“正在进行的动作”，所以习惯上不用进行时，直接说 I like this book。`}
  ]
},

{
  id:`g11`, ch:`第二章 · 五个时态`, lv:`进阶`, name:`一般过去时：那一刻发生了什么`,
  sub:`规则动词加 -ed，不规则动词要单独记`,
  body:`
    <p>He <b class="o">broke</b> a cup yesterday. —— 事情发生在过去，而且和现在没有直接关系，就用一般过去时。</p>

    <h3>两种变化方式</h3>
    <table class="tbl">
      <tr><th>类型</th><th>怎么变</th><th>例子</th></tr>
      <tr><td>规则动词</td><td>+ed</td><td>clean → clean<b>ed</b>&nbsp; open → open<b>ed</b>&nbsp; play → play<b>ed</b></td></tr>
      <tr><td>不规则动词</td><td>单独记</td><td>break → <b>broke</b>&nbsp; go → <b>went</b>&nbsp; see → <b>saw</b>&nbsp; have → <b>had</b></td></tr>
      <tr><td>be 动词</td><td>am/is → was，are → were</td><td>He <b>was</b> happy. They <b>were</b> happy.</td></tr>
    </table>
    <p><b>规则动词加 ed 的细节：</b>一般 +ed；以 e 结尾只 +d（like → liked）；辅音字母+y 改 ied（study → studied）；重读闭音节双写（stop → stopped）。</p>

    <h3>否定和疑问：请 did 出场</h3>
    <div class="rule"><div class="rt">公式</div>
      <p>否定：主语 + <b>didn't</b> + 原形 &nbsp;&nbsp; He <b>didn't break</b> it.</p>
      <p>疑问：<b>Did</b> + 主语 + 原形？ &nbsp;&nbsp; <b>Did</b> he <b>break</b> it?</p>
      <p>简答：Yes, he <b>did</b>. / No, he <b>didn't</b>.</p></div>
    <div class="warn"><div class="wt">最大的坑</div>
      <p>did 已经表示过去，后面动词<b>必须回原形</b>：</p>
      <p>He didn't <s>broke</s> it → He didn't <b>break</b> it.</p>
      <p>Did he <s>broke</s> it? → Did he <b>break</b> it?</p>
      <p>过去只能标一次，不能标两次。</p></div>

    <h3>常见时间标志词</h3>
    <p>yesterday &nbsp;·&nbsp; last night / last week / last year &nbsp;·&nbsp; two days <b>ago</b> &nbsp;·&nbsp; in 2020 &nbsp;·&nbsp; just now</p>

    <div class="tip"><b>和现在完成时最容易混：</b>一般过去时只关心“那时发生了”；现在完成时关心“现在的结果”。<br>
    He <b>broke</b> the cup yesterday.（昨天打破的，就事论事）<br>
    He <b>has broken</b> the cup.（杯子现在是破的）</div>

    <div class="key"><div class="kt">一句话记住</div>
      <p>过去的事用过去式；一旦请了 did，动词就得回原形。</p></div>`,
  quiz:[
    {q:`He ______ a cup yesterday. 应该填什么？`,
     o:[`breaks`,`is breaking`,`has broken`,`broke`], a:3,
     w:`yesterday 明确指向过去，用一般过去时 broke。has broken 表示“现在杯子是破的”，和 yesterday 搭配不自然。`},
    {q:`下面哪一句是正确的？`,
     o:[`He didn't break the cup.`,`He doesn't broke the cup.`,`He not break the cup.`,`He didn't broke the cup.`], a:0,
     w:`didn't 已经表示过去，后面的动词回原形 break。don't/doesn't 是现在的否定词，不能和过去的事搭配。`},
    {q:`把 She cleaned the table. 变成一般疑问句，应该是？`,
     o:[`Did she cleaned the table?`,`Was she clean the table?`,`Did she clean the table?`,`Does she clean the table?`], a:2,
     w:`用 Did 提问，后面动词回原形 clean。这是过去时疑问句的固定结构。`},
    {q:`be 动词的过去式，下面哪一组是对的？`,
     o:[`am→been，are→been`,`am→is，are→are`,`am→were，are→was`,`am→was，are→were`], a:3,
     w:`I/he/she/it 用 was，you/we/they 用 were。这是过去时里唯一按人称分的一处。`},
    {q:`study 的过去式是哪个？`,
     o:[`studied`,`studyed`,`studies`,`studed`], a:0,
     w:`辅音字母 + y 结尾，把 y 改成 i 再加 ed：study → studied。元音 + y 才直接加 ed，比如 played。`},
    {q:`下面哪个时间词和一般过去时最搭？`,
     o:[`now`,`two days ago`,`next week`,`every day`], a:1,
     w:`two days ago（两天前）指向过去某个具体时间点，配一般过去时。every day 配一般现在时，now 配进行时，next week 配将来时。`}
  ]
},

{
  id:`g12`, ch:`第二章 · 五个时态`, lv:`挑战`, name:`现在完成时：过去的事，现在的账`,
  sub:`have / has + 过去分词，重点是“现在怎么样”`,
  body:`
    <p>这是五个时态里最难的一个，但抓住一句话就通了：</p>
    <div class="rule"><div class="rt">核心</div>
      <p>动作发生在<b>过去</b>，但说话的人关心的是<b>现在的结果</b>。</p>
      <p>He <b>has broken</b> a cup. = 杯子（现在）是破的。</p></div>

    <h3>形式</h3>
    <p><b>have / has + 过去分词</b>（has 用于 he / she / it / 单数）</p>
    <table class="tbl">
      <tr><th>动词</th><th>过去式</th><th>过去分词</th></tr>
      <tr><td>break</td><td>broke</td><td class="hl">broken</td></tr>
      <tr><td>clean</td><td>cleaned</td><td class="hl">cleaned</td></tr>
      <tr><td>go</td><td>went</td><td class="hl">gone</td></tr>
      <tr><td>see</td><td>saw</td><td class="hl">seen</td></tr>
      <tr><td>do</td><td>did</td><td class="hl">done</td></tr>
    </table>
    <p>规则动词的过去式和过去分词长得一样（cleaned / cleaned）；不规则动词要分别记（broke / broken）。</p>

    <h3>两个用法</h3>
    <div class="eg"><b>I <span class="o">have</span> lost my key.</b><em>我把钥匙丢了。→ 强调“现在我没钥匙”这个结果。</em></div>
    <div class="eg"><b>He <span class="o">has</span> lived here for ten years.</b><em>他在这儿住了十年。→ 从过去一直持续到现在。</em></div>

    <h3>和一般过去时的区别（最关键）</h3>
    <table class="tbl">
      <tr><th></th><th>一般过去时</th><th>现在完成时</th></tr>
      <tr><td>关注点</td><td>过去那一刻</td><td>现在的结果</td></tr>
      <tr><td>时间词</td><td>yesterday, ago, last week</td><td>already, yet, ever, never, just, since, for</td></tr>
      <tr><td>例子</td><td>I <b>lost</b> my key yesterday.</td><td>I <b>have lost</b> my key.</td></tr>
    </table>
    <p><b>不能混：</b>I <s>have lost</s> my key <s>yesterday</s>. —— 有具体过去时间就用过去时，不能用完成时。</p>

    <h3>否定和疑问</h3>
    <div class="rule"><div class="rt">公式</div>
      <p>否定：主语 + <b>haven't / hasn't</b> + 过去分词 &nbsp;&nbsp; He <b>hasn't finished</b> it.</p>
      <p>疑问：<b>Have / Has</b> + 主语 + 过去分词？ &nbsp;&nbsp; <b>Has</b> he <b>finished</b> it?</p></div>

    <div class="warn"><div class="wt">坑</div>
      <p>① have 后面跟的是<b>过去分词</b>，不是过去式：He has <s>broke</s> it → He has <b>broken</b> it。</p>
      <p>② 三单用 has：He <s>have</s> broken it → He <b>has</b> broken it。</p>
      <p>③ 有明确过去时间就不用完成时：I have seen him <s>yesterday</s> → I <b>saw</b> him yesterday。</p></div>

    <div class="key"><div class="kt">一句话记住</div>
      <p>过去发生、现在还在影响 —— 这就是现在完成时。</p></div>`,
  quiz:[
    {q:`He ______ his key, so he can't open the door. 应该填什么？`,
     o:[`is losing`,`loses`,`lost`,`has lost`], a:3,
     w:`后半句“所以现在打不开门”说明强调的是现在的结果，用现在完成时 has lost。单纯说过去某时丢了，才用 lost。`},
    {q:`下面哪一句是正确的？`,
     o:[`He has broken the cup.`,`He has broke the cup.`,`He have broken the cup.`,`He has breaked the cup.`], a:0,
     w:`主语 he 用 has；break 的过去分词是 broken（不是 broke，也不是 breaked）。`},
    {q:`I have seen him yesterday. 这句话错在哪里？`,
     o:[`seen 要改成 saw`,`yesterday 是具体过去时间，不能用现在完成时`,`have 要改成 has`,`没有错`], a:1,
     w:`现在完成时不能和明确的过去时间（yesterday、last week、ago）一起用。要么说 I saw him yesterday.，要么去掉 yesterday。`},
    {q:`现在完成时由哪两部分组成？`,
     o:[`be + doing`,`will + 原形`,`did + 原形`,`have/has + 过去分词`], a:3,
     w:`have/has 负责扛人称，过去分词负责表示“已经完成”。这两部分缺一不可。`},
    {q:`下面哪个词最可能出现在现在完成时的句子里？`,
     o:[`already`,`ago`,`last night`,`yesterday`], a:0,
     w:`already（已经）是现在完成时的典型标志。yesterday、ago、last night 都指向具体的过去时间，配一般过去时。`},
    {q:`He has lived here for ten years. 这句话表示什么？`,
     o:[`他将来会住十年`,`他从十年前一直住到现在`,`他十年前住在这里，现在不住`,`他每年住在这里`], a:1,
     w:`for + 一段时间配合现在完成时，表示动作从过去持续到现在。这是完成时的第二个用法。`}
  ]
},

{
  id:`g13`, ch:`第二章 · 五个时态`, lv:`进阶`, name:`一般将来时：还没发生的事`,
  sub:`will + 原形，或者 be going to + 原形`,
  body:`
    <p>He <b class="o">will break</b> a cup tomorrow. —— 事情还没发生，用一般将来时。</p>

    <h3>两种说法</h3>
    <table class="tbl">
      <tr><th>形式</th><th>什么时候用</th><th>例子</th></tr>
      <tr><td><b>will + 原形</b></td><td>临时决定、预测、承诺</td><td>I <b>will help</b> you.</td></tr>
      <tr><td><b>be going to + 原形</b></td><td>已经计划好、有迹象</td><td>I <b>am going to clean</b> my room.</td></tr>
    </table>
    <p>两个都能表示将来，差别不大。小学阶段重点是<b>把形式写对</b>，不用纠结选哪个。</p>

    <h3>否定和疑问</h3>
    <div class="rule"><div class="rt">公式</div>
      <p>will：否定 <b>won't</b> + 原形；疑问 <b>Will</b> + 主语 + 原形？</p>
      <p>He <b>won't break</b> it. &nbsp;/&nbsp; <b>Will</b> he <b>break</b> it?</p>
      <p>be going to：否定 be + not + going to；疑问 be 提前</p>
      <p>He <b>isn't going to break</b> it. &nbsp;/&nbsp; <b>Is</b> he <b>going to break</b> it?</p></div>

    <h3>常见时间标志词</h3>
    <p>tomorrow &nbsp;·&nbsp; next week / next month / next year &nbsp;·&nbsp; soon &nbsp;·&nbsp; in the future &nbsp;·&nbsp; in two days</p>

    <div class="warn"><div class="wt">坑</div>
      <p>① will 后面跟原形，不加 s、不加 to：He will <s>breaks</s> / <s>to break</s> → He will <b>break</b>。</p>
      <p>② be going to 的 be 要跟主语变：He <s>is going to</s> ✓ / They <s>is</s> going to → They <b>are</b> going to。</p>
      <p>③ going to 后面还是原形：I am going to <s>cleaning</s> → I am going to <b>clean</b>。</p></div>

    <div class="key"><div class="kt">一句话记住</div>
      <p>将来时的信号灯是 will 或 be going to，灯后面永远跟原形。</p></div>`,
  quiz:[
    {q:`We ______ visit the museum next week. 应该填什么？`,
     o:[`will`,`will to visit`,`are visit`,`visits`], a:0,
     w:`next week 表示将来，用 will + 原形。will 后面不加 to，也不加 s。`},
    {q:`He ______ clean his room tomorrow. 用 be going to 结构，应该填什么？`,
     o:[`is go to`,`is going`,`is going to`,`are going to`], a:2,
     w:`主语 he 是单数，配 is；结构是 be going to + 原形，to 和原形都不能少。`},
    {q:`把 They will come. 变成否定句，应该是？`,
     o:[`They won't come.`,`They don't will come.`,`They not will come.`,`They will not comes.`], a:0,
     w:`will 的否定是 won't（will not），直接放在主语后，后面动词保持原形。`},
    {q:`下面哪一句是错的？`,
     o:[`She won't sing a song.`,`She will sing a song.`,`She is going to sing a song.`,`She will to sing a song.`], a:3,
     w:`will 后面直接跟原形，不能加 to。“will to do” 是典型错误，和 can to do 一样。`},
    {q:`下面哪个词最可能出现在一般将来时的句子里？`,
     o:[`next month`,`just now`,`every day`,`yesterday`], a:0,
     w:`next month（下个月）指向将来。yesterday 和 just now 配过去时，every day 配一般现在时。`},
    {q:`I am going to ______ my homework. 应该填什么？`,
     o:[`does`,`did`,`do`,`doing`], a:2,
     w:`be going to 后面跟动词原形。going 已经是 ing 形式了，后面不能再跟 doing。`}
  ]
},

{
  id:`g14`, ch:`第二章 · 五个时态`, lv:`巩固`, name:`五个时态放一起看`,
  sub:`一张总表 + 三步判断法，考前扫一遍`,
  body:`
    <h3>一张表看全（还是 break）</h3>
    <table class="tbl">
      <tr><th>时态</th><th>形式</th><th>He 的主句</th><th>标志词</th></tr>
      <tr><td>一般现在</td><td>原形 / 三单 +s</td><td>He <b>breaks</b> cups.</td><td>every day, usually, often</td></tr>
      <tr><td>现在进行</td><td>be + doing</td><td>He <b>is breaking</b> a cup.</td><td>now, look, listen</td></tr>
      <tr><td>一般过去</td><td>-ed / 不规则</td><td>He <b>broke</b> a cup.</td><td>yesterday, ago, last week</td></tr>
      <tr><td>现在完成</td><td>have/has + 过去分词</td><td>He <b>has broken</b> a cup.</td><td>already, yet, just, for, since</td></tr>
      <tr><td>一般将来</td><td>will / be going to + 原形</td><td>He <b>will break</b> a cup.</td><td>tomorrow, next week, soon</td></tr>
    </table>

    <h3>同一个意思，五种说法</h3>
    <div class="eg"><b>He breaks a cup every week.</b><em>他每周都打破杯子。（习惯）</em></div>
    <div class="eg"><b>He is breaking a cup now.</b><em>他现在正在打破杯子。（此刻）</em></div>
    <div class="eg"><b>He broke a cup yesterday.</b><em>他昨天打破了杯子。（过去那一刻）</em></div>
    <div class="eg"><b>He has broken a cup.</b><em>他把杯子打破了。（杯子现在是破的）</em></div>
    <div class="eg"><b>He will break a cup tomorrow.</b><em>他明天会打破杯子。（还没发生）</em></div>

    <h3>三步判断法</h3>
    <div class="rule"><div class="rt">做题顺序</div>
      <p><b>第一步：找时间词。</b>yesterday → 过去；now → 进行；tomorrow → 将来；every day → 一般现在；already/for → 完成。</p>
      <p><b>第二步：看有没有“正在”或“已经”的意思。</b>正在 → 进行；已经、结果还看得见 → 完成。</p>
      <p><b>第三步：定形式，检查主语。</b>三单要不要加 s？be 用 am / is / are 哪个？助动词后面动词回原形了吗？</p></div>

    <div class="warn"><div class="wt">五个时态最常见的错</div>
      <p>He <s>break</s> cups every day. → He <b>breaks</b> cups every day.</p>
      <p>He <s>breaking</s> a cup now. → He <b>is breaking</b> a cup now.</p>
      <p>He didn't <s>broke</s> it. → He didn't <b>break</b> it.</p>
      <p>He has <s>broke</s> it. → He has <b>broken</b> it.</p>
      <p>He will <s>breaks</s> it. → He will <b>break</b> it.</p></div>

    <div class="key"><div class="kt">一句话记住</div>
      <p>时间词定方向，状态词定形式，最后检查主语配合 —— 三步走完再动笔。</p></div>`,
  quiz:[
    {q:`He ______ TV every evening. 应该填什么？`,
     o:[`watch`,`watched`,`watches`,`is watching`], a:2,
     w:`every evening 是一般现在时的标志；主语 he 是三单，watch 要加 es（以 ch 结尾）。`},
    {q:`They ______ football now. 应该填什么？`,
     o:[`are playing`,`will play`,`play`,`played`], a:0,
     w:`now 表示此刻正在，用现在进行时；主语 they 配 are。`},
    {q:`She ______ her homework yesterday. 应该填什么？`,
     o:[`is doing`,`did`,`does`,`has done`], a:1,
     w:`yesterday 是明确的过去时间，用一般过去时 did。has done 不能和 yesterday 一起用。`},
    {q:`I ______ my homework already. 应该填什么？`,
     o:[`finished`,`have finished`,`will finish`,`finish`], a:1,
     w:`already 是现在完成时的标志，表示“已经完成”。结构是 have + 过去分词。`},
    {q:`We ______ visit Grandma next Sunday. 应该填什么？`,
     o:[`have`,`will`,`are`,`did`], a:1,
     w:`next Sunday 指向将来，用 will + 原形。也可以说 are going to visit，但单个 are 不行，缺 going to。`},
    {q:`看到句子里的 already，最可能是什么时态？`,
     o:[`一般将来时`,`现在完成时`,`一般现在时`,`现在进行时`], a:1,
     w:`already（已经）、yet、just、ever、never 都是现在完成时的典型标志词。`}
  ]
},
/* ============ 第三章 · 被动语态 ============ */
{
  id:`g15`, ch:`第三章 · 被动语态`, lv:`进阶`, name:`主动和被动：谁做事，谁受事`,
  sub:`把宾语提到前面当主语，句子就“反过来”了`,
  body:`
    <p>同一件事，有两种说法：</p>
    <div class="eg"><b>Tom <span class="o">broke</span> the window.</b><em>主动：汤姆（做事的人）打破了窗户（受事的东西）。</em></div>
    <div class="eg"><b>The window <span class="o">was broken</span> by Tom.</b><em>被动：窗户（受事的东西）被汤姆打破了。</em></div>
    <p>两句话说的是同一件事，但<b class="k">站在谁的角度说</b>不一样。</p>

    <h3>怎么变：三步换位</h3>
    <div class="rule"><div class="rt">操作步骤</div>
      <p><b>①</b> 把主动句的<b>宾语</b>提到最前面，当新主语。</p>
      <p><b>②</b> 动词变成 <b>be + 过去分词</b>，be 的时态跟原句一致。</p>
      <p><b>③</b> 原来的主语放到 <b>by</b> 后面（不重要就省略）。</p></div>
    <table class="tbl">
      <tr><th>主动句</th><th>被动句</th></tr>
      <tr><td>Tom <b>broke</b> the window.</td><td>The window <b>was broken</b> by Tom.</td></tr>
      <tr><td>They <b>clean</b> the classroom.</td><td>The classroom <b>is cleaned</b>.</td></tr>
      <tr><td>She <b>will finish</b> the work.</td><td>The work <b>will be finished</b>.</td></tr>
    </table>

    <h3>三条必须记住的限制</h3>
    <div class="warn"><div class="wt">这些情况变不了被动</div>
      <p>① <b>只有及物动词</b>能变被动（因为要有宾语才能提到前面）。</p>
      <p>② 不及物动词不行：He <s>was arrived</s>. ✗</p>
      <p>③ 连系动词不行：He <s>is been</s> happy. ✗</p></div>

    <h3>by 后面要用宾格</h3>
    <div class="eg"><b>The window was broken by <span class="k">him</span>.</b><em>by 是介词，后面跟宾格：he → him，they → them，I → me。</em></div>
    <div class="eg x"><b>The window was broken by he.</b><em>错。介词后面不能跟主格。</em></div>

    <div class="tip"><b>为什么要用被动？</b>三种情况：① 不知道是谁做的（My bike was stolen.）② 谁做的不重要（English is spoken here.）③ 想突出“被怎么样”的那个东西（The window was broken!）</div>

    <div class="key"><div class="kt">一句话记住</div>
      <p>主动句看“谁动手”，被动句看“谁遭殃”；换位时动词要变成 be + 过去分词。</p></div>`,
  quiz:[
    {q:`把 Tom broke the window. 改成被动句，应该是？`,
     o:[`Tom was broken the window.`,`The window was broken by Tom.`,`The window broke by Tom.`,`The window is broken by Tom.`], a:1,
     w:`宾语 the window 提前当主语；broke 是过去时，所以 be 用 was；再加过去分词 broken；原主语放 by 后面。干扰项 The window broke by Tom. 更不行 —— 主动的 broke 后面不能跟 by 短语，缺了 be 就不是被动句。`},
    {q:`被动语态的基本结构是什么？`,
     o:[`be + 过去分词`,`have + 过去分词`,`will + 原形`,`be + doing`], a:0,
     w:`be + 过去分词是被动的固定结构。have + 过去分词是完成时，be + doing 是进行时，别混。`},
    {q:`下面哪一句不能变成被动句？`,
     o:[`They cleaned the room.`,`She broke the cup.`,`The baby cried.`,`We finished the work.`], a:2,
     w:`cry 是不及物动词，没有宾语可以提到前面，所以变不了被动。被动的前提是有宾语。`},
    {q:`The cup was broken ______ him. 应该填什么？`,
     o:[`with`,`to`,`for`,`by`], a:3,
     w:`被动句里表示“被谁”，用 by + 宾格。这里 him 已经是宾格形式，正确。`},
    {q:`被动句中，原句的主语放到哪里？`,
     o:[`放到动词前面`,`必须删掉`,`放到 by 后面，或者省略`,`放到句首`], a:2,
     w:`原主语通常放在 by 后面；如果不知道是谁、或者不重要，可以整个省掉：The classroom is cleaned every day.`},
    {q:`They clean the classroom every day. 变被动后是？`,
     o:[`The classroom is cleaning every day.`,`The classroom was cleaned every day.`,`The classroom is cleaned every day.`,`The classroom cleans every day.`], a:2,
     w:`原句是一般现在时，所以被动也用现在时：is cleaned。时态要跟原句保持一致。`}
  ]
},

{
  id:`g16`, ch:`第三章 · 被动语态`, lv:`挑战`, name:`各时态的被动：变的只是 be`,
  sub:`be 随时态变，过去分词永远不动`,
  body:`
    <p>被动句里有两个零件：<b class="o">be</b> 和 <b class="o">过去分词</b>。记住一句话就够用：</p>
    <div class="rule"><div class="rt">核心</div>
      <p><b>be 随时态变，过去分词永远不动。</b></p>
      <p>所以学被动，其实是复习惯用 be 的各个时态。</p></div>

    <h3>五个时态的被动（用 clean 演示）</h3>
    <p>这里换成 clean，是因为 break 的过去分词 broken 常被当形容词用（The cup is broken 有两种理解），用 clean 看结构更清楚。</p>
    <table class="tbl">
      <tr><th>时态</th><th>被动形式</th><th>例句</th></tr>
      <tr><td>一般现在</td><td>am/is/are + 过去分词</td><td>The room <b>is cleaned</b> every day.</td></tr>
      <tr><td>现在进行</td><td>am/is/are <b>being</b> + 过去分词</td><td>The room <b>is being cleaned</b> now.</td></tr>
      <tr><td>一般过去</td><td>was/were + 过去分词</td><td>The room <b>was cleaned</b> yesterday.</td></tr>
      <tr><td>现在完成</td><td>have/has <b>been</b> + 过去分词</td><td>The room <b>has been cleaned</b>.</td></tr>
      <tr><td>一般将来</td><td>will <b>be</b> + 过去分词</td><td>The room <b>will be cleaned</b> tomorrow.</td></tr>
    </table>
    <p>看出来了吗：<b>cleaned 一次都没变</b>，变的始终是前面那个 be。</p>

    <h3>否定和疑问</h3>
    <div class="rule"><div class="rt">公式</div>
      <p>否定：把 not 放在 be 后面 &nbsp;&nbsp; The room <b>isn't cleaned</b> every day.</p>
      <p>疑问：把 be 提到句首 &nbsp;&nbsp; <b>Is</b> the room <b>cleaned</b> every day?</p>
      <p>含情态动词：情态动词 + be + 过去分词 &nbsp;&nbsp; The room <b>must be cleaned</b>.</p></div>

    <div class="warn"><div class="wt">坑</div>
      <p>① 过去分词别写成过去式：The room was <s>cleaned</s> ✓（clean 两者同形）但 break 要写 <b>broken</b>，不是 <s>broke</s>。</p>
      <p>② 进行时的被动是 <b>being</b> + 过去分词，别丢 being：The room is <s>cleaning</s> ✗（那是“房间在打扫别人”，很荒唐）。</p>
      <p>③ 将来被动是 will <b>be</b> + 过去分词，两个 be 位置别乱。</p></div>

    <div class="key"><div class="kt">一句话记住</div>
      <p>被动句里，be 负责时态，过去分词负责“被”。</p></div>`,
  quiz:[
    {q:`The room ______ every day. 用被动语态，应该填什么？`,
     o:[`cleans`,`is cleaned`,`cleaned`,`is cleaning`], a:1,
     w:`every day 是一般现在时，被动结构是 is + 过去分词 cleaned。房间自己不会打扫，所以必须用被动。`},
    {q:`The room ______ yesterday. 用被动语态，应该填什么？`,
     o:[`is cleaned`,`will clean`,`has cleaned`,`was cleaned`], a:3,
     w:`yesterday 是过去时，be 要用 was，后面跟过去分词 cleaned。`},
    {q:`The room ______ tomorrow. 用被动语态，应该填什么？`,
     o:[`was cleaned`,`will be cleaned`,`is cleaned`,`will clean`], a:1,
     w:`将来时被动 = will + be + 过去分词。will 后面直接跟 be，不能省。`},
    {q:`The room has ______ cleaned. 应该填什么？`,
     o:[`been`,`be`,`being`,`is`], a:0,
     w:`现在完成时的被动是 have/has + been + 过去分词。been 是 be 的过去分词，这里不能换成 be 或 being。`},
    {q:`The window ______ by the boy. 用过去时的被动，应该填什么？`,
     o:[`was broken`,`is broken`,`were broken`,`was broke`], a:0,
     w:`主语 the window 是单数，过去时用 was；break 的过去分词是 broken，不是 broke。`},
    {q:`被动语态里，哪个部分会随时态变化？`,
     o:[`主语`,`by 短语`,`过去分词`,`be 动词`], a:3,
     w:`过去分词永远不变，变的是 be：is / was / has been / will be。抓住这一点，五个时态的被动就串起来了。`}
  ]
},

{
  id:`g17`, ch:`第三章 · 被动语态`, lv:`巩固`, name:`什么时候该用被动`,
  sub:`三个场景 + 五个坑，这一课是考试重点`,
  body:`
    <h3>三个该用被动的场景</h3>
    <div class="eg"><b>My bike <span class="o">was stolen</span>.</b><em>不知道是谁偷的 —— 说不出来，就用被动。</em></div>
    <div class="eg"><b>English <span class="o">is spoken</span> in many countries.</b><em>谁说的不重要 —— 重点是英语“被使用”这个事实。</em></div>
    <div class="eg"><b>Look! The window <span class="o">is broken</span>.</b><em>想强调的是窗户 —— 它怎么了，比谁打破的更重要。</em></div>

    <h3>主动还是被动？先问一句</h3>
    <div class="rule"><div class="rt">判断口诀</div>
      <p>主语是<b>动手的人</b> → 主动。主语是<b>被动手的东西</b> → 被动。</p>
      <p>Tom broke the window.（Tom 动手 → 主动）</p>
      <p>The window was broken.（窗户遭殃 → 被动）</p></div>

    <h3>五个高频坑</h3>
    <div class="warn"><div class="wt">一条一条对</div>
      <p>① <b>丢 be</b>：The room <s>cleaned</s> every day → The room <b>is cleaned</b> every day. 同理，The cup <s>broke</s> → The cup <b>was broken</b>.</p>
      <p>② <b>过去分词写成过去式</b>：The cup was <s>broke</s> → The cup was <b>broken</b>.</p>
      <p>③ <b>不及物动词硬变被动</b>：He <s>was arrived</s> → He <b>arrived</b>.</p>
      <p>④ <b>by 后面用主格</b>：by <s>he</s> → by <b>him</b>.</p>
      <p>⑤ <b>时态不跟原句</b>：They cleaned it → It <s>is</s> cleaned（错）→ It <b>was</b> cleaned（对）.</p></div>

    <h3>一个特别容易误判的地方</h3>
    <p><b>The window is broken.</b> 这句话有两种理解：</p>
    <table class="tbl">
      <tr><th>理解</th><th>意思</th><th>结构</th></tr>
      <tr><td>被动</td><td>窗户被（某人）打破了</td><td>be + 过去分词</td></tr>
      <tr><td>状态</td><td>窗户是破的（描述样子）</td><td>be + 形容词</td></tr>
    </table>
    <p>怎么分？看有没有 <b>by 短语</b>、看有没有时间状语：<b>The window was broken by Tom yesterday.</b> 一定是被动；<b>The window is broken. I can't close it.</b> 更像在描述状态。</p>
    <div class="tip"><b>考试提示：</b>题目里有 by + 人、或者括号要求“改为被动语态”，就按被动做；只是描述“门开着、杯子是破的”，按连系动词理解更自然。</div>

    <div class="key"><div class="kt">一句话记住</div>
      <p>有 by、有时态要求 → 被动；只描述样子 → 连系动词。</p></div>`,
  quiz:[
    {q:`My bike was stolen. 这句话为什么用被动？`,
     o:[`因为 steal 是不及物动词`,`因为 bike 是主语`,`因为句子太短`,`因为不知道是谁偷的`], a:3,
     w:`被动最常用的场景之一就是“不知道或不必说谁做的”。这时把受事的东西放到句首，动作施者干脆省掉。`},
    {q:`下面哪一句是正确的？`,
     o:[`The cup broken by him.`,`The cup was broken by he.`,`The cup was broken by him.`,`The cup was broke by him.`], a:2,
     w:`be 不能丢，break 的过去分词是 broken，by 后面跟宾格 him。三个点都要对。`},
    {q:`下面哪一句是错的？`,
     o:[`The work will be finished.`,`The window was broken by Tom.`,`The room is cleaned every day.`,`He was arrived at nine.`], a:3,
     w:`arrive 是不及物动词，没有宾语，不能变被动。应该说 He arrived at nine.`},
    {q:`“房子是 1990 年建的”用英语怎么说？`,
     o:[`The house built in 1990.`,`The house is build in 1990.`,`The house was built in 1990.`,`The house was build in 1990.`], a:2,
     w:`被动结构 be + 过去分词，过去时用 was，build 的过去分词是 built。`},
    {q:`The window is broken. 这句话可能表示什么？`,
     o:[`只能是“窗户被打破了”`,`只能是“窗户是破的”`,`这句话是错的`,`两种都可能，要结合上下文`], a:3,
     w:`broken 既是过去分词也是形容词，所以这句话可能是在说“被打破了”，也可能是在描述“是破的”这个状态。看有没有 by 短语和上下文。`},
    {q:`主动句 They cleaned the room yesterday. 改成被动，应该是？`,
     o:[`The room is cleaned yesterday.`,`The room cleaned yesterday.`,`The room was cleaned yesterday.`,`The room has cleaned yesterday.`], a:2,
     w:`时态要跟原句一致（过去时），所以 be 用 was：The room was cleaned yesterday.`}
  ]
},

/* ============ 第四章 · 综合闯关 ============ */
{
  id:`g18`, ch:`第四章 · 综合闯关`, lv:`挑战`, name:`综合闯关`,
  sub:`20 道题，动词分类 + 五个时态 + 被动，全用上`,
  body:`
    <p>这一关把前面 17 课混在一起考。做题时按这个顺序想：</p>
    <div class="rule"><div class="rt">解题五步</div>
      <p><b>①</b> 这个动词在句子里是干什么的？（动作 / 等号 / 态度 / 帮忙）</p>
      <p><b>②</b> 找时间词，确定时态。</p>
      <p><b>③</b> 看主语，决定 be 和 s。</p>
      <p><b>④</b> 有助动词，后面是不是原形？</p>
      <p><b>⑤</b> 如果主语是“被动手的东西”，考虑被动。</p></div>
    <div class="tip"><b>做错了怎么办：</b>看解析，然后回到那一课重读一遍。错在同一课三次以上，就把那一课多过一遍 —— 这比刷十套卷子有用。</div>
    <div class="key"><div class="kt">通关条件</div>
      <p>20 题都做一遍、错题都看懂了，就算通关；全对的话回来领“全对”徽章。</p></div>`,
  quiz:[
    {q:`He ______ to school by bike every day.`,
     o:[`go`,`is going`,`went`,`goes`], a:3,
     w:`every day 是一般现在时；主语 he 是三单，go 要加 es。这一题考“时间词 + 三单”两个点。`},
    {q:`Look! The children ______ in the garden.`,
     o:[`played`,`plays`,`play`,`are playing`], a:3,
     w:`Look! 提示此刻正在，用现在进行时；主语 the children 是复数，配 are + playing。`},
    {q:`My father ______ the car yesterday afternoon.`,
     o:[`washed`,`has washed`,`washes`,`is washing`], a:0,
     w:`yesterday afternoon 是明确的过去时间，用一般过去时 washed。有具体过去时间就不能用现在完成时。`},
    {q:`I ______ this book twice. It's very good.`,
     o:[`will read`,`am reading`,`have read`,`read`], a:2,
     w:`twice（两次）表示到目前为止的经历，是现在完成时的典型用法：have + 过去分词 read。`},
    {q:`We ______ a picnic next Sunday.`,
     o:[`had`,`have`,`will have`,`are having`], a:2,
     w:`next Sunday 指向将来，用 will + 原形。are having 是“正在开”，和 next Sunday 不搭。`},
    {q:`The soup ______ delicious. Can I have some more?`,
     o:[`tastes`,`taste`,`tasted`,`is tasting`], a:0,
     w:`taste 在这里是连系动词，表示“尝起来”，后面跟形容词 delicious；主语 the soup 是单数，动词加 s。`},
    {q:`You ______ cross the road when the light is red.`,
     o:[`needn't`,`should`,`mustn't`,`don't have to`], a:2,
     w:`红灯时是“绝对不许”过马路，用 mustn't。needn't 和 don't have to 是“不必”，语气完全不对。`},
    {q:`Must I finish it today? — No, you ______.`,
     o:[`don't`,`mustn't`,`needn't`,`can't`], a:2,
     w:`Must I …? 的否定回答固定用 needn't（不必）。答 mustn't 是“不许”，答非所问。`},
    {q:`He doesn't ______ coffee.`,
     o:[`like`,`likes`,`liked`,`liking`], a:0,
     w:`doesn't 已经扛了三单，后面动词必须回原形 like。`},
    {q:`______ your sister good at drawing?`,
     o:[`Can`,`Is`,`Does`,`Are`], a:1,
     w:`good at 前面需要 be 动词构成“be good at”；主语 your sister 是单数，用 Is。`},
    {q:`The classroom ______ every morning.`,
     o:[`cleans`,`is cleaned`,`is cleaning`,`cleaned`], a:1,
     w:`教室是“被打扫”的，用被动：is + 过去分词 cleaned。every morning 说明是一般现在时。`},
    {q:`The window ______ by the boy yesterday.`,
     o:[`was broken`,`was broke`,`is broken`,`broke`], a:0,
     w:`被动 + 过去时：was + broken。break 的过去分词是 broken，不是 broke。`},
    {q:`A new library ______ next year.`,
     o:[`is built`,`builds`,`will be built`,`will build`], a:2,
     w:`图书馆是“被建”的，将来时被动：will + be + 过去分词 built。`},
    {q:`下面哪一句是错的？`,
     o:[`He can swim.`,`He can swims.`,`He swam.`,`He is swimming.`], a:1,
     w:`情态动词后面必须跟原形，不能加 s。这是情态动词的第一条铁律。`},
    {q:`They ______ TV when I came in. 这句话该用什么时态？`,
     o:[`watch`,`were watching`,`are watching`,`have watched`], a:1,
     w:`我进来时（过去某一刻）他们正在看电视 → 过去进行时。本册没细讲，但可以按“过去 + 正在”推出来：were + watching。`},
    {q:`The flowers in the garden ______ beautiful.`,
     o:[`be`,`am`,`are`,`is`], a:2,
     w:`主语是 the flowers（复数），be 用 are。注意中间的 in the garden 是修饰语，不影响主语的单复数。`},
    {q:`He has ______ his homework already.`,
     o:[`finished`,`finish`,`finishes`,`finishing`], a:0,
     w:`has 后面跟过去分词 finished。already 也提示这里是现在完成时。`},
    {q:`It ______ dark. Let's go home.`,
     o:[`get`,`got`,`is getting`,`gets`], a:2,
     w:`get 在这里是连系动词“变得”，后面跟形容词 dark。“天正在变黑”用进行时 is getting，Let's go home 说明是此刻的情况。`},
    {q:`The cup ______ by Tom. Don't worry, it was old.`,
     o:[`broke`,`breaks`,`was broken`,`is broken`], a:2,
     w:`有 by Tom，说明是被动；后面 was old 说明语境在过去，所以用 was broken。`},
    {q:`下面哪一句同时用了“被动”和“过去时”？`,
     o:[`The room will be cleaned.`,`The room is cleaned.`,`The room was cleaned.`,`The room cleans.`], a:2,
     w:`was cleaned = be 的过去式 + 过去分词，既是被动又是过去时。A 是一般现在被动，D 是将来被动。`}
  ]
},

];

const REF = {
  name:`一页速查表`, sub:`考前扫一遍，五张表全在这儿`,
  body:`
  <div class="ref">
    <h2>① 动词的五种岗位</h2>
    <table class="tbl">
      <tr><th>岗位</th><th>干什么</th><th>后面跟什么</th><th>例子</th></tr>
      <tr><td>及物动词</td><td>说动作，动作落到宾语上</td><td>宾语</td><td>He broke <b>the cup</b>.</td></tr>
      <tr><td>不及物动词</td><td>说动作，自己就说完</td><td>什么都不跟（要接就加介词）</td><td>The baby <b>cried</b>.</td></tr>
      <tr><td>连系动词</td><td>当等号，说明主语什么样</td><td>形容词 / 名词</td><td>He <b>looks</b> happy.</td></tr>
      <tr><td>情态动词</td><td>表态度和判断</td><td>动词原形</td><td>He <b>can</b> break it.</td></tr>
      <tr><td>助动词</td><td>帮别人造否定、疑问、时态</td><td>原形 / 过去分词 / ing</td><td>He <b>doesn't</b> break it.</td></tr>
    </table>

    <h2>② 四步判定</h2>
    <p>① 后面跟形容词、说主语“什么样”？→ <b>连系动词</b><br>
    ② 后面跟原形、表示能不能该不该？→ <b>情态动词</b><br>
    ③ 自己不表意，只帮否定/疑问/时态？→ <b>助动词</b><br>
    ④ 在说一个动作：后面有宾语 → <b>及物</b>；没有 → <b>不及物</b>。</p>
    <p><b>提醒：</b>主语要是“被弄的东西”，动词得用 be + 过去分词（被动），别按“没宾语 = 不及物”硬套 —— 看 ④ 表。</p>

    <h2>③ 五个时态（同一个 break）</h2>
    <table class="tbl">
      <tr><th>时态</th><th>形式</th><th>例句</th><th>标志词</th></tr>
      <tr><td>一般现在</td><td>原形 / 三单 +s</td><td>He <b>breaks</b> cups.</td><td>every day, usually, often</td></tr>
      <tr><td>现在进行</td><td>be + doing</td><td>He <b>is breaking</b> a cup.</td><td>now, look, listen</td></tr>
      <tr><td>一般过去</td><td>-ed / 不规则</td><td>He <b>broke</b> a cup.</td><td>yesterday, ago, last week</td></tr>
      <tr><td>现在完成</td><td>have/has + 过去分词</td><td>He <b>has broken</b> a cup.</td><td>already, yet, just, for, since</td></tr>
      <tr><td>一般将来</td><td>will / be going to + 原形</td><td>He <b>will break</b> a cup.</td><td>tomorrow, next week, soon</td></tr>
    </table>

    <h2>④ 被动语态（be 变，过去分词不变）</h2>
    <table class="tbl">
      <tr><th>时态</th><th>被动形式</th><th>例句</th></tr>
      <tr><td>一般现在</td><td>am/is/are + 过去分词</td><td>The room <b>is cleaned</b>.</td></tr>
      <tr><td>现在进行</td><td>am/is/are being + 过去分词</td><td>The room <b>is being cleaned</b>.</td></tr>
      <tr><td>一般过去</td><td>was/were + 过去分词</td><td>The room <b>was cleaned</b>.</td></tr>
      <tr><td>现在完成</td><td>have/has been + 过去分词</td><td>The room <b>has been cleaned</b>.</td></tr>
      <tr><td>一般将来</td><td>will be + 过去分词</td><td>The room <b>will be cleaned</b>.</td></tr>
      <tr><td>带情态动词</td><td>情态动词 + be + 过去分词</td><td>The room <b>must be cleaned</b>.</td></tr>
    </table>
    <p>主动变被动三步：<b>宾语提前 → 动词变 be + 过去分词 → 原主语放 by 后（可省）</b>。by 后面用宾格（by him，不是 by he）。</p>

    <h2>⑤ 常用不规则动词（原形 — 过去式 — 过去分词）</h2>
    <table class="tbl">
      <tr><td>break — broke — broken</td><td>go — went — gone</td><td>see — saw — seen</td></tr>
      <tr><td>do — did — done</td><td>have — had — had</td><td>make — made — made</td></tr>
      <tr><td>take — took — taken</td><td>give — gave — given</td><td>eat — ate — eaten</td></tr>
      <tr><td>write — wrote — written</td><td>speak — spoke — spoken</td><td>come — came — come</td></tr>
      <tr><td>buy — bought — bought</td><td>teach — taught — taught</td><td>find — found — found</td></tr>
      <tr><td>run — ran — run</td><td>sing — sang — sung</td><td>swim — swam — swum</td></tr>
    </table>

    <h2>⑥ 十一个最容易错的点</h2>
    <ul>
      <li>He <s>can breaks</s> → He <b>can break</b></li>
      <li>He <s>doesn't breaks</s> → He <b>doesn't break</b></li>
      <li>He <s>didn't broke</s> → He <b>didn't break</b></li>
      <li>He <s>will breaks</s> → He <b>will break</b></li>
      <li>He has <s>broke</s> → He has <b>broken</b></li>
      <li>He looks <s>happily</s> → He looks <b>happy</b></li>
      <li>He <s>broke</s>.（及物没宾语）→ He broke <b>the cup</b>.</li>
      <li>The cup <s>broke</s>.（受事当主语）→ The cup <b>was broken</b>.</li>
      <li>He <s>breaking</s> → He <b>is breaking</b></li>
      <li>The room <s>cleaned</s> → The room <b>is cleaned</b></li>
      <li>by <s>he</s> → by <b>him</b></li>
    </ul>
    <p style="font-size:13px;color:#5a6472">还有一条：Must I …? 的否定回答是 <b>No, you needn't.</b>，不是 mustn't。</p>
  </div>`
};


/* ============ 引擎 ============ */
const KEY = `eng-gram-adv-v1`;
let state = {done:[]};
try{ state = JSON.parse(localStorage.getItem(KEY)) || {done:[]}; }catch(e){ state = {done:[]}; }
if(!Array.isArray(state.done)) state.done = [];

const app = document.getElementById(`app`);
const fill = document.getElementById(`fill`);
const dn = document.getElementById(`dn`);
const TOTAL = L.length;

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function isDone(d){ return state.done.indexOf(d.id) > -1; }
function paintBar(){
  const n = state.done.filter(function(id){ return L.some(function(l){ return l.id === id; }); }).length;
  fill.style.width = (n / TOTAL * 100) + `%`;
  dn.textContent = n;
  document.getElementById(`dt`).textContent = TOTAL;
}
function go(h){ location.hash = h; }

function renderTOC(){
  const groups = [];
  L.forEach(function(l, i){
    let g = groups.filter(function(x){ return x.ch === l.ch; })[0];
    if(!g){ g = {ch:l.ch, items:[]}; groups.push(g); }
    g.items.push({l:l, i:i});
  });
  let html = `
  <div class="hero">
    <h1>英语语法进阶</h1>
    <p>动词分类 · 五个时态 · 被动语态 · 一个动词贯穿全书 · 三年级起可以自己学</p>
    <div class="how">
      <b>怎么用：</b>按顺序一课一课走，不要跳。第一章把动词分类认清楚，第二章再学时态，第三章才讲被动 ——
      这三块的顺序不能颠倒，因为后面的每一课都要用前面的东西。每课先看例子和规律，再做题；答错会有解析告诉你为什么。
    </div>`;
  groups.forEach(function(g){
    html += `<div class="grp">` + g.ch + `</div>`;
    g.items.forEach(function(it){
      const l = it.l, d = isDone(l);
      const cls = l.lv === `基础` ? `b` : (l.lv === `进阶` ? `m` : `h`);
      html += `
      <div class="card ` + (d ? `done` : ``) + `" data-i="` + it.i + `">
        <div class="no">` + (d ? `✓` : (it.i + 1)) + `</div>
        <div class="tx"><b>` + l.name + `</b><i>` + l.sub + `</i></div>
        <div class="rt">
          <span class="lv ` + cls + `">` + l.lv + `</span>
          <span class="st">` + (d ? `已过关` : l.quiz.length + ` 题`) + `</span>
        </div>
      </div>`;
    });
  });
  html += `
  <div class="grp">附录</div>
  <div class="card" data-ref="1">
    <div class="no">速</div>
    <div class="tx"><b>` + REF.name + `</b><i>` + REF.sub + `</i></div>
    <div class="rt"><span class="st">可打印</span></div>
  </div>
  <button class="reset" id="reset">清空进度，从头再来</button>`;
  app.innerHTML = html;

  app.querySelectorAll(`.card[data-i]`).forEach(function(el){
    el.addEventListener(`click`, function(){ go(`lesson-` + el.dataset.i); });
  });
  app.querySelector(`.card[data-ref]`).addEventListener(`click`, function(){ go(`ref`); });
  document.getElementById(`reset`).addEventListener(`click`, function(){
    state.done = []; save(); paintBar(); renderTOC();
  });
  window.scrollTo(0, 0);
}

function renderRef(){
  app.innerHTML = `
    <div class="chap">附录</div>
    <h1 class="lt">一页速查表</h1>
    <p class="sub">把最重要的表格放在一起，复习和考前看这一页就够。</p>
    ` + REF.body + `
    <div class="nav"><button id="back">← 回到目录</button><span></span></div>`;
  document.getElementById(`back`).addEventListener(`click`, function(){ go(``); });
  window.scrollTo(0, 0);
}

function renderLesson(idx){
  const d = L[idx];
  app.innerHTML = `
    <div class="chap">` + d.ch + ` &nbsp;·&nbsp; ` + d.lv + `</div>
    <h1 class="lt">` + d.name + `</h1>
    <p class="sub">` + d.sub + `</p>
    <div class="content">` + d.body + `</div>
    <div class="quizwrap">
      <h2 class="qh">练一练 <span>共 ` + d.quiz.length + ` 题 · 每题四个选项，只有一个机会</span></h2>
      <div id="qs"></div>
      <div id="summary"></div>
      <div class="qfoot">
        <button id="finish" disabled>完成这一课</button>
        <span id="score" class="done-badge"></span>
      </div>
    </div>
    <div class="nav">
      <button id="prev" ` + (idx === 0 ? `disabled` : ``) + `>← 上一课</button>
      <button id="toc">目录</button>
      <button id="next" ` + (idx === L.length - 1 ? `disabled` : ``) + `>下一课 →</button>
    </div>`;
  document.getElementById(`prev`).addEventListener(`click`, function(){ if(idx > 0) go(`lesson-` + (idx - 1)); });
  document.getElementById(`next`).addEventListener(`click`, function(){ if(idx < L.length - 1) go(`lesson-` + (idx + 1)); });
  document.getElementById(`toc`).addEventListener(`click`, function(){ go(``); });
  buildQuiz(d, idx);
  window.scrollTo(0, 0);
}

/* ============ 撒礼花 ============ */
let fxRunning = false;
function confetti(){
  const cv = document.getElementById(`fx`);
  if(!cv || fxRunning) return;
  const ctx = cv.getContext(`2d`);
  const dpr = window.devicePixelRatio || 1;
  cv.width = window.innerWidth * dpr;
  cv.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = window.innerWidth, H = window.innerHeight;
  const colors = [`#2b6de5`,`#f08a24`,`#17945a`,`#d9463f`,`#7a5cd6`,`#f5c542`,`#38b6d6`];
  const ps = [];
  for(let i = 0; i < 120; i++){
    const x = W * (0.06 + Math.random() * 0.88);
    ps.push({
      x: x, y: H * 0.94 + Math.random() * 30,
      vx: (x < W / 2 ? 1.6 : -1.6) + (Math.random() - 0.5) * 5,
      vy: -(11 + Math.random() * 9),
      w: 4 + Math.random() * 7, h: 7 + Math.random() * 9,
      rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4,
      c: colors[i % colors.length]
    });
  }
  fxRunning = true;
  const t0 = performance.now();
  let last = t0;
  function frame(t){
    const dt = Math.min(34, t - last); last = t;
    const k = dt / 16.67;
    ctx.clearRect(0, 0, W, H);
    for(let i = 0; i < ps.length; i++){
      const p = ps[i];
      p.vy += 0.42 * k;
      p.vx *= (1 - 0.006 * k);
      p.x += p.vx * k; p.y += p.vy * k; p.rot += p.vr * k;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, Math.min(1, 1 - Math.max(0, p.y - H * 0.58) / (H * 0.5)));
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if(t - t0 < 2100){
      requestAnimationFrame(frame);
    } else {
      ctx.clearRect(0, 0, W, H);
      fxRunning = false;
    }
  }
  requestAnimationFrame(frame);
}

function buildQuiz(d, idx){
  const wrap = document.getElementById(`qs`);
  const finish = document.getElementById(`finish`);
  const scoreEl = document.getElementById(`score`);
  const sumEl = document.getElementById(`summary`);
  let answered = 0, right = 0;
  const wrongNo = [];
  if(isDone(d)){ finish.textContent = `已过关 · 回目录`; }

  function update(){
    scoreEl.textContent = `已答 ` + answered + `/` + d.quiz.length + `　答对 ` + right;
    finish.disabled = answered < d.quiz.length;
    if(answered === d.quiz.length){
      const all = (right === d.quiz.length);
      sumEl.className = `show` + (all ? ` allok` : ``);
      let txt;
      if(all){
        txt = `<div class="big">全对！` + d.quiz.length + ` 题全中 🎉</div>本课的知识点你已经拿下了，可以点下面的按钮过关。`;
      } else {
        const listTxt = wrongNo.length <= 5
          ? `错的是第 ` + wrongNo.join(`、`) + ` 题。`
          : `错了 ` + wrongNo.length + ` 题。`;
        txt = `<div class="big">本课完成：答对 ` + right + ` / ` + d.quiz.length + `（` +
              Math.round(right * 100 / d.quiz.length) + `%）</div>` + listTxt +
              `每题下面的红框里就是正确答案和原因，往上翻一眼再点过关；` +
              `也可以先回目录，明天再做一遍。`;
      }
      sumEl.innerHTML = txt;
    }
  }

  d.quiz.forEach(function(q, qi){
    const box = document.createElement(`div`);
    box.className = `q`;
    const qt = document.createElement(`p`);
    qt.className = `qt`;
    qt.textContent = (qi + 1) + `. ` + q.q;
    box.appendChild(qt);

    const why = document.createElement(`div`);
    why.className = `why`;

    q.o.forEach(function(text, oi){
      const b = document.createElement(`button`);
      b.className = `opt`;
      b.type = `button`;
      b.innerHTML = `<b>` + `ABCD`[oi] + `</b>．` + text;
      b.addEventListener(`click`, function(){
        if(box.dataset.ans) return;          // 只判一次，改答案无效
        box.dataset.ans = `1`;
        answered++;
        const btns = box.querySelectorAll(`.opt`);
        btns.forEach(function(x){ x.disabled = true; });

        if(oi === q.a){
          right++;
          b.classList.add(`ok`);
          b.insertAdjacentHTML(`beforeend`, `<span class="tag">✓ 你选对了</span>`);
          why.className = `why ok show`;
          why.innerHTML = `<span class="wt2">✓ 答对了 · 为什么这么答</span>` + q.w;
          confetti();
        } else {
          wrongNo.push(qi + 1);
          b.classList.add(`bad`);
          b.insertAdjacentHTML(`beforeend`, `<span class="tag">✗ 你选的</span>`);
          btns[q.a].classList.add(`ok`);
          btns[q.a].insertAdjacentHTML(`beforeend`, `<span class="tag">正确答案</span>`);
          why.className = `why bad show`;
          why.innerHTML = `<span class="wt2">✗ 答错了 · 正确答案是 ` + `ABCD`[q.a] + `</span>` + q.w;
        }
        const lk = document.createElement(`div`);
        lk.className = `lockline`;
        lk.textContent = `本题已判定，再点选项不会改变结果。`;
        box.appendChild(lk);
        update();
      });
      box.appendChild(b);
    });
    box.appendChild(why);
    wrap.appendChild(box);
  });

  update();

  finish.addEventListener(`click`, function(){
    if(isDone(d)){ go(``); return; }
    if(state.done.indexOf(d.id) < 0){ state.done.push(d.id); save(); paintBar(); }
    if(idx < L.length - 1) go(`lesson-` + (idx + 1));
    else go(``);
  });
}

function route(){
  const h = location.hash.replace(`#`, ``);
  if(h.indexOf(`lesson-`) === 0){
    const i = parseInt(h.slice(7), 10);
    if(!isNaN(i) && L[i]){ renderLesson(i); return; }
  }
  if(h === `ref`){ renderRef(); return; }
  renderTOC();
}
window.addEventListener(`hashchange`, route);
document.getElementById(`brand`).addEventListener(`click`, function(){ go(``); });
paintBar();
route();
</script>
