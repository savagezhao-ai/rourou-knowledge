<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>周长怎么算 · 长方形花坛</title>
<style>
  :root{
    --ink:#2b2a27; --muted:#7a7770; --line:#e6e2d8;
    --paper:#fdfcf8; --card:#fff;
    --blue:#1f5f8b; --orange:#e07a3f; --green:#3f8f6b;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:28px 20px 48px;
    display:grid; grid-template-columns:minmax(300px,1fr) minmax(420px,1.15fr);
    gap:32px; align-items:start}
  @media (max-width:880px){ .wrap{grid-template-columns:1fr; gap:20px; padding:18px 14px 32px} }

  h1{font-size:26px; margin:0 0 6px; letter-spacing:.5px}
  .sub{color:var(--muted); font-size:14px; margin:0 0 22px}

  .q{background:var(--card); border:1px solid var(--line); border-radius:14px;
     padding:18px 20px; font-size:17px; line-height:1.75; margin:0 0 20px}
  .q b{color:var(--blue)}

  ol.steps{list-style:none; margin:0 0 22px; padding:0; counter-reset:s}
  ol.steps li{counter-increment:s; position:relative; padding:12px 0 12px 44px;
    font-size:15.5px; line-height:1.7; border-bottom:1px dashed var(--line)}
  ol.steps li:last-child{border-bottom:0}
  ol.steps li::before{content:counter(s); position:absolute; left:0; top:12px;
    width:28px; height:28px; border-radius:50%; background:var(--blue); color:#fff;
    font-size:14px; display:flex; align-items:center; justify-content:center}
  .k{color:var(--orange); font-weight:600}

  .btns{display:flex; gap:10px; flex-wrap:wrap}
  button{
    font:inherit; font-size:15px; padding:10px 18px; border-radius:10px;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    cursor:pointer; transition:.15s;
  }
  button:hover{border-color:#c9c3b4}
  button.primary{background:var(--blue); color:#fff; border-color:var(--blue)}
  button.primary:hover{background:#184c70}

  .stage{background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:14px}
  svg{width:100%; height:auto; display:block; touch-action:none}

  .readout{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:16px}
  @media (max-width:520px){ .readout{grid-template-columns:repeat(2,1fr)} }
  .cell{background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px}
  .cell .lab{font-size:12.5px; color:var(--muted); margin-bottom:4px}
  .cell .val{font-size:19px; font-weight:600; font-variant-numeric:tabular-nums}
  .cell.hi{background:#fdf3ec; border-color:#f3d3bd}
  .cell.hi .val{color:var(--orange); font-size:22px}
  .cell.area .val{color:var(--green)}

  .hint{font-size:13px; color:var(--muted); margin-top:12px; text-align:center}
</style>

<script>
(function(){
  var K='rourou_sc';
  var SC=null, cur=null;
  try{
    cur=new URLSearchParams(location.search).get('sharecode');
    if(cur){ SC=cur; try{ sessionStorage.setItem(K,cur); }catch(e){} }
    else { try{ SC=sessionStorage.getItem(K); }catch(e){} }
  }catch(e){}
  if(!SC) return;

  // 站内地址补 sharecode；站外/已带参/非 http 返回 null
  function withSC(u){
    if(!u) return null;
    try{
      var x=new URL(u, location.href);
      if(x.protocol!=='http:' && x.protocol!=='https:') return null;
      if(x.origin!==location.origin) return null;
      if(x.searchParams.get('sharecode')===SC) return null;
      x.searchParams.set('sharecode',SC);
      return x.href;
    }catch(e){ return null; }
  }

  // 无参进入时补参数跳转（脚本捕获不到的情况兜底）
  if(!cur){
    var self=withSC(location.href);
    if(self && !/[?&]sharecode=/.test(location.search)){
      location.replace(self);
      return;
    }
  }

  // ① 点击拦截：先于站内任何处理器，动态渲染的卡片也覆盖
  document.addEventListener('click', function(e){
    var t=e.target;
    while(t && t!==document && t.tagName!=='A') t=t.parentNode;
    if(!t || t===document) return;
    if(t.target && t.target!=='_self') return;
    var h=t.getAttribute('href');
    if(!h || /^(mailto:|tel:|javascript:|#)/i.test(h)) return;
    var nu=withSC(t.href);
    if(!nu) return;
    e.preventDefault();
    e.stopPropagation();
    location.href=nu;
  }, true);

  // ② 静态与动态插入的资源统一补参
  var ATTRS=['src','href','poster','srcset'];
  var SEL='img[src],img[srcset],video[src],video[poster],audio[src],source[src],source[srcset],'+
          'script[src],link[rel=stylesheet][href],link[rel=preload][href],a[href]';
  function fixOne(el,attr){
    var v=el.getAttribute(attr);
    if(!v) return;
    if(attr==='srcset'){
      var changed=false;
      var parts=v.split(',').map(function(x){
        var t=x.trim().split(/\s+/);
        if(!t[0]) return x;
        var nu=withSC(t[0]);
        if(nu){ t[0]=nu; changed=true; }
        return t.join(' ');
      });
      if(changed) el.setAttribute('srcset',parts.join(', '));
      return;
    }
    var nu=withSC(v);
    if(nu) el.setAttribute(attr,nu);
  }
  function fixEl(el){
    for(var k=0;k<ATTRS.length;k++){
      if(el.hasAttribute && el.hasAttribute(ATTRS[k])) fixOne(el,ATTRS[k]);
    }
  }
  function fix(root){
    var scope=(root&&root.querySelectorAll)?root:document;
    var els=scope.querySelectorAll(SEL);
    for(var i=0;i<els.length;i++) fixEl(els[i]);
  }

  // ③ 资源加载失败时补参重试一次（防漏网）
  document.addEventListener('error', function(e){
    var el=e.target;
    if(!el||!el.tagName) return;
    var tag=el.tagName;
    if(tag!=='IMG'&&tag!=='VIDEO'&&tag!=='SOURCE'&&tag!=='AUDIO') return;
    if(el.getAttribute('data-sc-retry')) return;
    var nu=withSC(el.getAttribute('src')||'');
    if(!nu) return;
    el.setAttribute('data-sc-retry','1');
    el.setAttribute('src',nu);
  }, true);

  function boot(){
    fix(document);
    try{
      new MutationObserver(function(ms){
        for(var i=0;i<ms.length;i++){
          var added=ms[i].addedNodes;
          for(var j=0;j<added.length;j++){
            var n=added[j];
            if(n.nodeType!==1) continue;
            fixEl(n);
            if(n.querySelectorAll) fix(n);
          }
        }
      }).observe(document.documentElement,{childList:true,subtree:true});
    }catch(e){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();
</script>
<!-- sharecode-passthrough:end -->

<body>
<div class="wrap">
  <aside>
    <h1>周长怎么算</h1>
    <p class="sub">拖动右下角的小圆点，改变长方形的长和宽</p>

    <p class="q">一个长方形花坛，长 <b>8 米</b>，宽 <b>5 米</b>。<br>
       四周围一圈篱笆，篱笆要多少米？</p>

    <ol class="steps">
      <li><span class="k">周长</span>，就是绕图形走一圈的长度。</li>
      <li>长方形有 <span class="k">两条长</span>、<span class="k">两条宽</span>。</li>
      <li>周长 = (长 + 宽) × 2 = (<span id="s-l">8</span> + <span id="s-w">5</span>) × 2
          = <span class="k" id="s-p">26</span> 米</li>
    </ol>

    <div class="btns">
      <button class="primary" id="play">▶ 听讲解</button>
      <button id="trace">绕一圈看看</button>
      <button id="reset">回到题目</button>
    </div>
  </aside>

  <main>
    <div class="stage">
      <svg id="stage" viewBox="0 0 600 420" aria-label="长方形周长示意图">
        <defs>
          <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M30 0H0V30" fill="none" stroke="#e5e0d2" stroke-width="1"/>
          </pattern>
        </defs>
        <rect x="0" y="0" width="600" height="420" fill="url(#grid)"/>
        <rect id="fill" x="180" y="120" width="240" height="150"
              fill="rgba(31,95,139,.07)"/>
        <path id="perim" fill="none" stroke="#e07a3f" stroke-width="6"
              stroke-linejoin="round"/>
        <path id="tracePath" fill="none" stroke="#1f5f8b" stroke-width="10"
              stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>
        <circle id="handle" cx="420" cy="270" r="13" fill="#e07a3f"
                stroke="#fff" stroke-width="3" style="cursor:grab"/>
        <text id="lenT" x="300" y="104" text-anchor="middle"
              font-size="17" fill="#1f5f8b">长 8 米</text>
        <text id="widT" x="162" y="201" text-anchor="end"
              font-size="17" fill="#1f5f8b">宽 5 米</text>
      </svg>
    </div>

    <div class="readout">
      <div class="cell"><div class="lab">长</div><div class="val" id="r-l">8 米</div></div>
      <div class="cell"><div class="lab">宽</div><div class="val" id="r-w">5 米</div></div>
      <div class="cell hi"><div class="lab">周长</div><div class="val" id="r-p">26 米</div></div>
      <div class="cell area"><div class="lab">面积</div><div class="val" id="r-a">40 平方米</div></div>
    </div>
    <p class="hint">周长是四条边的总长；面积是里面铺满的大小 —— 别混了</p>
  </main>
</div>

<script>
(function(){
  var OX=180, OY=120, S=30, MAXW=14, MAXH=9, MINW=2, MINH=2;
  var W=8, H=5;

  var svg=document.getElementById('stage');
  var fill=document.getElementById('fill');
  var perim=document.getElementById('perim');
  var tracePath=document.getElementById('tracePath');
  var handle=document.getElementById('handle');
  var lenT=document.getElementById('lenT');
  var widT=document.getElementById('widT');

  function fmt(n){ return Number.isInteger(n)? String(n) : n.toFixed(1); }

  function draw(){
    var w=W*S, h=H*S;
    fill.setAttribute('x',OX); fill.setAttribute('y',OY);
    fill.setAttribute('width',w); fill.setAttribute('height',h);

    var d='M'+OX+' '+OY+' H'+(OX+w)+' V'+(OY+h)+' H'+OX+' Z';
    perim.setAttribute('d',d);
    tracePath.setAttribute('d',d);

    handle.setAttribute('cx',OX+w);
    handle.setAttribute('cy',OY+h);

    lenT.setAttribute('x',OX+w/2);
    lenT.setAttribute('y',OY-16);
    lenT.textContent='长 '+fmt(W)+' 米';

    widT.setAttribute('x',OX-16);
    widT.setAttribute('y',OY+h/2+6);
    widT.textContent='宽 '+fmt(H)+' 米';

    document.getElementById('r-l').textContent=fmt(W)+' 米';
    document.getElementById('r-w').textContent=fmt(H)+' 米';
    document.getElementById('r-p').textContent=fmt((W+H)*2)+' 米';
    document.getElementById('r-a').textContent=fmt(W*H)+' 平方米';

    document.getElementById('s-l').textContent=fmt(W);
    document.getElementById('s-w').textContent=fmt(H);
    document.getElementById('s-p').textContent=fmt((W+H)*2);

    tracePath.style.transition='none';
    tracePath.style.strokeDasharray='0 99999';
  }

  function toSvg(ev){
    var r=svg.getBoundingClientRect();
    return {
      x:(ev.clientX-r.left)/r.width*600,
      y:(ev.clientY-r.top)/r.height*420
    };
  }

  var drag=false;
  handle.addEventListener('pointerdown',function(e){
    drag=true;
    try{ handle.setPointerCapture(e.pointerId); }catch(_){}
    handle.style.cursor='grabbing';
    e.preventDefault();
  });
  handle.addEventListener('pointermove',function(e){
    if(!drag) return;
    var p=toSvg(e);
    W=Math.min(MAXW,Math.max(MINW,Math.round((p.x-OX)/S*2)/2));
    H=Math.min(MAXH,Math.max(MINH,Math.round((p.y-OY)/S*2)/2));
    draw();
  });
  handle.addEventListener('pointerup',function(e){
    drag=false; handle.style.cursor='grab';
    try{ handle.releasePointerCapture(e.pointerId); }catch(_){}
  });

  document.getElementById('reset').onclick=function(){ W=8; H=5; draw(); };

  document.getElementById('trace').onclick=function(){
    var L=tracePath.getTotalLength();
    tracePath.style.transition='none';
    tracePath.style.strokeDasharray=L;
    tracePath.style.strokeDashoffset=L;
    void tracePath.getBoundingClientRect();
    tracePath.style.transition='stroke-dashoffset 2.4s linear';
    tracePath.style.strokeDashoffset=0;
  };

  var au=document.getElementById('au');
  var playBtn=document.getElementById('play');
  playBtn.onclick=function(){
    if(au.paused){ au.play(); playBtn.textContent='❚❚ 暂停'; }
    else{ au.pause(); playBtn.textContent='▶ 听讲解'; }
  };
  au.onended=function(){ playBtn.textContent='▶ 听讲解'; };

  draw();
})();
</script>
