<title>多位数乘法 · 竖式第二行为什么要错位</title>
<style>
  :root{
    --ink:#2b2a27; --muted:#7a7770; --line:#e6e2d8;
    --paper:#fdfcf8; --card:#fff;
    --blue:#1f5f8b; --orange:#e07a3f; --green:#3f8f6b;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:900px; margin:0 auto; padding:28px 20px 60px}

  h1{font-size:24px; margin:0 0 8px; letter-spacing:.5px}
  .sub{color:var(--muted); font-size:14px; margin:0 0 20px; line-height:1.6}

  /* 视频舞台 */
  .stage{
    position:relative; border-radius:16px; overflow:hidden;
    background:#0d0d0f; border:1px solid var(--line);
    box-shadow:0 6px 26px rgba(0,0,0,.10);
  }
  .stage video{
    display:block; width:100%; height:auto; max-height:74vh;
    background:#0d0d0f; outline:none;
  }
  /* 播放遮罩：默认就显示，点一下才开始播（不确定浏览器给不给自动播，一律手动） */
  .playmask{
    position:absolute; inset:0; z-index:3; width:100%; height:100%;
    border:0; padding:0; cursor:pointer; color:#fff;
    background:rgba(0,0,0,.42);
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    font-family:inherit; font-size:16px; font-weight:600; letter-spacing:.5px;
    transition:background .2s;
  }
  .playmask:hover{background:rgba(0,0,0,.32)}
  .playmask .tri{
    width:74px; height:74px; border-radius:50%;
    background:rgba(255,255,255,.96); color:#1a1a1c;
    display:flex; align-items:center; justify-content:center;
    font-size:28px; padding-left:6px;
    box-shadow:0 6px 22px rgba(0,0,0,.35);
    transition:transform .18s;
  }
  .playmask:active .tri{transform:scale(.92)}
  .playmask[hidden]{display:none}

  /* 操作区 */
  .actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px}
  .btn{
    display:inline-flex; align-items:center; gap:6px;
    padding:11px 18px; border-radius:11px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); text-decoration:none;
    font-size:14.5px; font-weight:600; transition:transform .14s, box-shadow .14s, border-color .14s;
  }
  .btn:hover{transform:translateY(-1px); box-shadow:0 4px 14px rgba(0,0,0,.08); border-color:#d6d0c2}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--blue); color:#fff; border-color:var(--blue)}
  .btn.primary:hover{border-color:var(--blue); box-shadow:0 5px 16px rgba(31,95,139,.28)}

  .hint{font-size:13px; color:var(--muted); margin-top:16px; line-height:1.7}
  .hint b{color:var(--orange)}

  /* 要点卡 */
  .keys{margin-top:26px; display:grid; gap:10px}
  .key{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:13px 16px; font-size:15px; line-height:1.7;
  }
  .key span{color:var(--blue); font-weight:600}

  @media (max-width:600px){
    .wrap{padding:22px 14px 56px}
    h1{font-size:21px}
    .stage video{max-height:56vh}
    .btn{flex:1 1 auto; justify-content:center}
  }
</style>

<script>
(function(){
  var K='rourou_sc';
  var SC=null, cur=null;
  try{
    cur=new URLSearchParams(location.search).get('sharecode');
    if(cur){ SC=cur; try{ sessionStorage.setItem(K,cur); }catch(e){} }
    else { try{ SC=sessionStorage.getItem(K); }catch(e){} }
  }catch(e){}
  if(!SC) return;

  // 站内地址补 sharecode；站外/已带参/非 http 返回 null
  function withSC(u){
    if(!u) return null;
    try{
      var x=new URL(u, location.href);
      if(x.protocol!=='http:' && x.protocol!=='https:') return null;
      if(x.origin!==location.origin) return null;
      if(x.searchParams.get('sharecode')===SC) return null;
      x.searchParams.set('sharecode',SC);
      return x.href;
    }catch(e){ return null; }
  }

  // 无参进入时补参数跳转（脚本捕获不到的情况兜底）
  if(!cur){
    var self=withSC(location.href);
    if(self && !/[?&]sharecode=/.test(location.search)){
      location.replace(self);
      return;
    }
  }

  // ① 点击拦截：先于站内任何处理器，动态渲染的卡片也覆盖
  document.addEventListener('click', function(e){
    var t=e.target;
    while(t && t!==document && t.tagName!=='A') t=t.parentNode;
    if(!t || t===document) return;
    if(t.target && t.target!=='_self') return;
    var h=t.getAttribute('href');
    if(!h || /^(mailto:|tel:|javascript:|#)/i.test(h)) return;
    var nu=withSC(t.href);
    if(!nu) return;
    e.preventDefault();
    e.stopPropagation();
    location.href=nu;
  }, true);

  // ② 静态与动态插入的资源统一补参
  var ATTRS=['src','href','poster','srcset'];
  var SEL='img[src],img[srcset],video[src],video[poster],audio[src],source[src],source[srcset],'+
          'script[src],link[rel=stylesheet][href],link[rel=preload][href],a[href]';
  function fixOne(el,attr){
    var v=el.getAttribute(attr);
    if(!v) return;
    if(attr==='srcset'){
      var changed=false;
      var parts=v.split(',').map(function(x){
        var t=x.trim().split(/\s+/);
        if(!t[0]) return x;
        var nu=withSC(t[0]);
        if(nu){ t[0]=nu; changed=true; }
        return t.join(' ');
      });
      if(changed) el.setAttribute('srcset',parts.join(', '));
      return;
    }
    var nu=withSC(v);
    if(nu) el.setAttribute(attr,nu);
  }
  function fixEl(el){
    for(var k=0;k<ATTRS.length;k++){
      if(el.hasAttribute && el.hasAttribute(ATTRS[k])) fixOne(el,ATTRS[k]);
    }
  }
  function fix(root){
    var scope=(root&&root.querySelectorAll)?root:document;
    var els=scope.querySelectorAll(SEL);
    for(var i=0;i<els.length;i++) fixEl(els[i]);
  }

  // ③ 资源加载失败时补参重试一次（防漏网）
  document.addEventListener('error', function(e){
    var el=e.target;
    if(!el||!el.tagName) return;
    var tag=el.tagName;
    if(tag!=='IMG'&&tag!=='VIDEO'&&tag!=='SOURCE'&&tag!=='AUDIO') return;
    if(el.getAttribute('data-sc-retry')) return;
    var nu=withSC(el.getAttribute('src')||'');
    if(!nu) return;
    el.setAttribute('data-sc-retry','1');
    el.setAttribute('src',nu);
  }, true);

  function boot(){
    fix(document);
    try{
      new MutationObserver(function(ms){
        for(var i=0;i<ms.length;i++){
          var added=ms[i].addedNodes;
          for(var j=0;j<added.length;j++){
            var n=added[j];
            if(n.nodeType!==1) continue;
            fixEl(n);
            if(n.querySelectorAll) fix(n);
          }
        }
      }).observe(document.documentElement,{childList:true,subtree:true});
    }catch(e){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();
</script>
<!-- sharecode-passthrough:end -->
</head>
<body>

<div class="wrap">
  <h1>多位数乘法</h1>
  <p class="sub">竖式第二行为什么要错位 · 72 秒，有配音</p>

  <div class="stage">
    <video id="v" src="multiply-voice.mp4" poster="poster.jpg"
           controls playsinline preload="auto"></video>
    <button class="playmask" id="playmask">
      <span class="tri">▶</span>
      <span>点一下播放</span>
    </button>
  </div>

  <div class="actions">
    <a class="btn primary" href="multiply-voice.mp4" download>⬇ 下载到手机</a>
    <a class="btn" href="../../261014/index.html">📖 读文字版</a>
  </div>

  <p class="hint">视频 3.5 MB，点中间的大按钮就开始。想看全屏，点播放条右下角的方框。</p>

  <div class="keys">
    <div class="key"><span>第二行往左挪一格</span>，因为它算的是「几十个」，不是一个一个。</div>
    <div class="key"><span>满十进一</span>，是打包：十个一毛钱换一张一块钱，位置换了，钱没多。</div>
    <div class="key">整件事只有一句话：<span>位置决定大小</span>。</div>
  </div>
</div>

<script>
(function(){
  var v = document.getElementById('v');
  var mask = document.getElementById('playmask');

  // 不自动播放：一律等用户点。点下去一定成功，不存在"有时播有时不播"。
  mask.addEventListener('click', function(){
    mask.hidden = true;
    v.play();
  });

  // 用原生播放条暂停后再点视频，遮罩不回来，避免挡住控制条
})();
</script>
