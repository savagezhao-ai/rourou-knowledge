<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>鹈鹕骑单车 · 3D 世界</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  /* ⚠️ 视口高度：iOS / iPadOS Safari 上 100vh 与 height:100% 取的是"大视口"（含被浏览器
     工具栏遮住的区域），而 window.innerHeight 才是真正可见的高度；两者不一致时，底部控制条
     会被工具栏压住，又因 overflow:hidden 无法滚动查看 —— 表现就是"显示不全 / 没适配"。
     故统一采用 JS 写入的 --vh（= innerHeight/100），CSS 与画布共用同一个值。 */
  html,body{height:100%;height:calc(var(--vh,1vh)*100);overflow:hidden;background:#0a1220;
    overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}

  #app{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  #app:active{cursor:grabbing}

  .layer{position:fixed;left:0;top:0;width:100%;height:calc(var(--vh,1vh)*100);pointer-events:none;z-index:10}

  .panel{
    background:rgba(12,19,32,.52);
    -webkit-backdrop-filter:blur(14px) saturate(150%);
    backdrop-filter:blur(14px) saturate(150%);
    border:1px solid rgba(255,255,255,.16);
    border-radius:16px;
    box-shadow:0 10px 34px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.14);
  }
  .pointer{pointer-events:auto}

  /* 标题 + 状态（top 让开左上角的"返回首页"按钮） */
  #title{position:absolute;top:calc(76px + env(safe-area-inset-top,0px));left:calc(24px + env(safe-area-inset-left,0px));
         padding:14px 20px 12px;color:#fff}
  #title h1{font-size:19px;font-weight:650;letter-spacing:.5px;display:flex;align-items:center;gap:9px}
  #title h1 .dot{width:7px;height:7px;border-radius:50%;background:#ffcf5c;box-shadow:0 0 10px #ffcf5c}
  #title p{margin-top:5px;font-size:11px;letter-spacing:1.1px;color:rgba(255,255,255,.5);text-transform:uppercase}
  #hud{margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.12);
       display:flex;gap:8px;flex-wrap:wrap}
  #hud span{font-size:11.5px;color:#dbe8f7;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums}

  /* 天气 */
  #sky{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));right:calc(24px + env(safe-area-inset-right,0px));
       padding:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;
       max-width:min(46vw,320px)}
  #sky .btn{font-size:12.5px;padding:8px 11px}

  /* 控制条 */
  #bar{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
       display:flex;align-items:center;gap:10px;padding:9px 12px;flex-wrap:wrap;justify-content:center;max-width:min(94vw,760px)}
  .btn{
    pointer-events:auto;cursor:pointer;border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.07);color:#eaf1fb;font-size:13px;line-height:1;
    padding:10px 14px;border-radius:11px;display:inline-flex;align-items:center;gap:7px;
    transition:background .16s ease,transform .16s ease,border-color .16s ease;white-space:nowrap;
    font-family:inherit;
  }
  .btn:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3)}
  .btn:active{transform:scale(.955)}
  .btn.on{background:#f4f7fc;color:#101826;border-color:#fff;font-weight:600}
  .btn.rec.on{background:#ff4d4d;border-color:#ff6b6b;color:#fff}
  .sep{width:1px;height:24px;background:rgba(255,255,255,.16)}
  .slider{pointer-events:auto;display:flex;align-items:center;gap:9px;color:#cfe0f5;font-size:12px;padding:0 6px}
  input[type=range]{pointer-events:auto;-webkit-appearance:none;appearance:none;width:104px;height:4px;border-radius:4px;
    background:linear-gradient(90deg,#7fd2ff var(--p,50%),rgba(255,255,255,.2) var(--p,50%));outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;
    box-shadow:0 1px 5px rgba(0,0,0,.4);cursor:pointer}
  #spd{width:30px;text-align:right;font-variant-numeric:tabular-nums;color:#8fd6ff}

  #hint{position:absolute;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));
        color:rgba(255,255,255,.6);font-size:12px;line-height:1.85;text-align:right;
        text-shadow:0 1px 8px rgba(0,0,0,.5)}
  #hint b{color:#fff;font-weight:600}

  #load{position:fixed;left:0;top:0;width:100%;height:calc(var(--vh,1vh)*100);z-index:50;
        display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;
        padding:0 18px;padding-bottom:env(safe-area-inset-bottom,0px);
        background:#0a1220;transition:opacity .7s ease}
  #load.gone{opacity:0;pointer-events:none}
  .spin{width:38px;height:38px;border-radius:50%;border:2.5px solid rgba(255,255,255,.18);border-top-color:#ffcf5c;
        animation:sp .85s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #load span{color:rgba(255,255,255,.55);font-size:12.5px;letter-spacing:2px}
  #load em{color:rgba(255,255,255,.3);font-size:11px;font-style:normal;letter-spacing:.5px;
           max-width:290px;text-align:center;line-height:1.7;margin-top:-6px}

  /* 返回首页按钮（肉肉网站导航；玩具页在 toy/<slug>/ 下，故退两级） */
  #home{position:fixed;top:calc(22px + env(safe-area-inset-top,0px));left:calc(24px + env(safe-area-inset-left,0px));
        z-index:30;pointer-events:auto;display:inline-flex;align-items:center;gap:6px;
        padding:9px 14px;border-radius:11px;background:rgba(12,19,32,.52);border:1px solid rgba(255,255,255,.16);
        color:#eaf1fb;font-size:13px;line-height:1;text-decoration:none;font-family:inherit;white-space:nowrap;
        -webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);
        box-shadow:0 10px 34px rgba(0,0,0,.32);transition:background .16s ease,transform .16s ease}
  #home:hover{background:rgba(255,255,255,.16)}
  #home:active{transform:scale(.96)}

  /* 平板 / 窄窗口：整体收一档，避免元素互相压叠 */
  @media (max-width:1024px){
    #title{top:calc(66px + env(safe-area-inset-top,0px))}
    #sky{max-width:min(58vw,300px)}
    #bar{bottom:calc(18px + env(safe-area-inset-bottom,0px));gap:8px}
    #hint{font-size:11.5px;bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  }

  /* 手机 */
  @media (max-width:720px){
    #home{top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));
          padding:8px 11px;font-size:11.5px;border-radius:9px}
    #title{padding:10px 13px 9px;top:calc(56px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));border-radius:13px}
    #title h1{font-size:15px} #title p{display:none}
    #hud{margin-top:7px;padding-top:7px;gap:5px}
    #hud span{font-size:10.5px;padding:2px 7px}
    #sky{top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));padding:6px;gap:5px;max-width:44vw}
    #sky .btn{font-size:11px;padding:7px 8px;border-radius:9px}
    #hint{display:none}
    #bar{bottom:calc(12px + env(safe-area-inset-bottom,0px));gap:6px;padding:7px 8px;border-radius:13px;max-width:96vw}
    .btn{font-size:11.5px;padding:8px 10px;border-radius:9px;gap:5px}
    .sep{height:17px}
    .slider{font-size:11px;gap:6px;padding:0 3px}
    input[type=range]{width:62px;height:3px}
    input[type=range]::-webkit-slider-thumb{width:13px;height:13px}
    #spd{width:26px}
  }

  /* 触屏设备（iPad 等）：放大点击目标，符合 44pt 触控建议 */
  @media (pointer:coarse){
    .btn{min-height:42px}
    #sky .btn{min-height:38px}
    #home{min-height:42px}
  }
</style>
</head>
<body>
<canvas id="app"></canvas>
<a id="home" href="../../index.html">🏠 返回首页</a>

<div class="layer">
  <div id="title" class="panel">
    <h1><span class="dot"></span>鹈鹕骑单车</h1>
    <p>Procedural 3D World · Three.js</p>
    <div id="hud"><span id="hw">☀️ 晴</span><span id="hr">直道</span><span id="hg">坡度 0%</span></div>
  </div>

  <div id="sky" class="panel">
    <button class="btn on" data-w="clear">☀️ 晴</button>
    <button class="btn" data-w="rain">🌧️ 雨</button>
    <button class="btn" data-w="snow">❄️ 雪</button>
    <button class="btn" data-w="storm">⛈️ 雷暴</button>
  </div>

  <div id="bar" class="panel">
    <button class="btn on" id="btnPlay">⏸ 暂停</button>
    <div class="sep"></div>
    <button class="btn" id="btnCam">🎥 环绕</button>
    <div class="sep"></div>
    <div class="slider">速度<input type="range" id="rng" min="0" max="200" value="100"><span id="spd">1.0×</span></div>
    <div class="sep"></div>
    <button class="btn rec" id="btnRec">⏺ 录制</button>
  </div>

  <div id="hint">
    <div><b>拖拽</b> 旋转视角 · <b>滚轮</b> 缩放</div>
    <div><b>1–4</b> 切换天气 · <b>C</b> 切换镜头</div>
  </div>
</div>

<div id="load"><div class="spin"></div><span>正在筑造大地</span><em>首次打开要现场生成整片 3D 世界，约需 10–30 秒</em></div>

<script>
  window.__errs = [];
  window.__showErr = function (msg) {
    window.__errs.push(msg);
    let box = document.getElementById('errbox');
    if (!box) {
      box = document.createElement('div');
      box.id = 'errbox';
      box.style.cssText = 'position:fixed;left:12px;top:12px;right:12px;z-index:999;background:rgba(150,20,20,.92);' +
        'color:#fff;font:12px/1.5 ui-monospace,Menlo,monospace;padding:12px 14px;border-radius:10px;white-space:pre-wrap;max-height:60vh;overflow:auto';
      document.body.appendChild(box);
    }
    box.textContent = window.__errs.join('\n\n');
  };
  addEventListener('error', e => {
    if (e.target && e.target.tagName === 'SCRIPT') window.__showErr('脚本加载失败: ' + (e.target.src || ''));
    else window.__showErr((e.message || 'Error') + '\n' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || ''));
  }, true);
  addEventListener('unhandledrejection', e => window.__showErr('Promise 未捕获: ' + ((e.reason && e.reason.stack) || e.reason)));
</script>
