<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>科学素养测试 · 肉肉的 AI 科研小站</title>
<style>
  :root{
    --ink:#2b2a27; --muted:#7a7770; --line:#e6e2d8;
    --paper:#fdfcf8; --card:#fff;
    --blue:#1f5f8b; --orange:#e07a3f; --green:#3f8f6b; --red:#c94f45;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:680px; margin:0 auto; padding:24px 18px 80px}
  .screen[hidden]{display:none}

  /* ── 开始屏 ── */
  .hero{padding:36px 0 8px; text-align:center}
  .hero .icon{font-size:52px; line-height:1}
  h1{font-size:28px; margin:14px 0 10px; letter-spacing:.5px}
  .lead{font-size:16px; color:var(--muted); line-height:1.75; margin:0 auto; max-width:420px}
  .lead b{color:var(--blue)}
  .facts{
    display:flex; gap:10px; justify-content:center; margin:26px 0 30px; flex-wrap:wrap;
  }
  .fact{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:12px 18px; min-width:96px;
  }
  .fact .n{font-size:24px; font-weight:700; color:var(--blue); font-variant-numeric:tabular-nums}
  .fact .l{font-size:12.5px; color:var(--muted); margin-top:2px}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:15px 32px; border-radius:14px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); font-family:inherit;
    font-size:17px; font-weight:600; cursor:pointer; text-decoration:none;
    transition:transform .14s, box-shadow .14s, background .14s, border-color .14s;
  }
  .btn:hover{transform:translateY(-1px); box-shadow:0 6px 18px rgba(0,0,0,.09)}
  .btn:active{transform:scale(.975)}
  .btn.primary{background:var(--blue); color:#fff; border-color:var(--blue); box-shadow:0 6px 20px rgba(31,95,139,.25)}
  .btn.primary:hover{box-shadow:0 8px 24px rgba(31,95,139,.32)}
  .btn.block{display:flex; width:100%}

  /* ── 答题屏 ── */
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px}
  .step{font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums}
  .step b{color:var(--blue); font-size:17px}
  .bar{height:6px; border-radius:99px; background:#eeeade; overflow:hidden; margin-bottom:26px}
  .bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,#4a8fb8,var(--blue));
    border-radius:99px; transition:width .35s cubic-bezier(.3,.8,.4,1)}

  .qbox{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:22px 20px; margin-bottom:18px;
  }
  .qtext{font-size:19px; line-height:1.65; font-weight:600; margin:0}
  .opts{display:grid; gap:10px}
  .opt{
    display:flex; align-items:flex-start; gap:12px;
    width:100%; text-align:left; padding:15px 16px;
    background:var(--card); border:1.5px solid var(--line); border-radius:13px;
    font-family:inherit; font-size:16px; line-height:1.55; color:var(--ink);
    cursor:pointer; transition:border-color .15s, background .15s, transform .12s;
  }
  .opt:hover:not(:disabled){border-color:#c9c2b2; background:#fffdf7}
  .opt:active:not(:disabled){transform:scale(.99)}
  .opt .k{
    flex:0 0 26px; height:26px; border-radius:8px; background:#f2efe6;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:700; color:#8c8679; margin-top:1px;
  }
  .opt .t{flex:1}
  .opt:disabled{cursor:default}
  .opt.right{border-color:var(--green); background:#eef8f2}
  .opt.right .k{background:var(--green); color:#fff}
  .opt.wrong{border-color:var(--red); background:#fdf0ef}
  .opt.wrong .k{background:var(--red); color:#fff}
  .opt.dim{opacity:.5}

  .verdict{margin:16px 0 0; font-size:15px; line-height:1.7; color:var(--muted); display:none}
  .verdict.on{display:block}
  .verdict b{color:var(--ink)}
  .verdict .ok{color:var(--green); font-weight:700}
  .verdict .no{color:var(--red); font-weight:700}

  .navrow{margin-top:18px}
  #btnNext[hidden]{display:none}

  /* ── 结果屏 ── */
  .scorewrap{text-align:center; padding:20px 0 8px}
  .score{
    font-size:76px; font-weight:800; line-height:1; letter-spacing:-2px;
    font-variant-numeric:tabular-nums; color:var(--blue);
  }
  .score small{font-size:22px; font-weight:600; color:var(--muted); letter-spacing:0}
  .comment{font-size:17px; line-height:1.7; margin:16px auto 0; max-width:400px; color:var(--ink)}
  .comment span{color:var(--muted); font-size:14.5px; display:block; margin-top:6px}

  .review{margin:32px 0 0}
  .review h2{font-size:15px; color:var(--muted); font-weight:600; letter-spacing:.5px; margin:0 0 12px}
  .ritem{
    background:var(--card); border:1px solid var(--line); border-left:4px solid var(--line);
    border-radius:11px; padding:13px 15px; margin-bottom:9px;
  }
  .ritem.ok{border-left-color:var(--green)}
  .ritem.no{border-left-color:var(--red)}
  .rq{font-size:15px; line-height:1.6; font-weight:600; margin:0 0 7px}
  .rq .mark{margin-right:6px}
  .ra{font-size:14px; line-height:1.65; color:var(--muted); margin:0}
  .ra .right-t{color:var(--green); font-weight:600}
  .ra .your-t{color:var(--red)}
  .rlink{
    display:inline-block; margin-top:8px; font-size:13.5px; color:var(--blue);
    text-decoration:none; border-bottom:1px dashed rgba(31,95,139,.4); padding-bottom:1px;
  }
  .rlink:hover{border-bottom-style:solid}

  .endbtns{display:grid; gap:10px; margin-top:26px}
  .endbtns .row{display:grid; grid-template-columns:1fr 1fr; gap:10px}

  .foot{text-align:center; font-size:12.5px; color:#b6b1a5; margin-top:34px; line-height:1.8}

  @media (max-width:520px){
    .wrap{padding:18px 14px 76px}
    h1{font-size:24px}
    .qtext{font-size:17.5px}
    .opt{font-size:15.5px; padding:14px}
    .score{font-size:64px}
    .facts{gap:8px}
    .fact{padding:10px 14px; min-width:84px}
  }
</style>

<script>
(function(){
  var K='rourou_sc';
  var SC=null, cur=null;
  try{
    cur=new URLSearchParams(location.search).get('sharecode');
    if(cur){ SC=cur; try{ sessionStorage.setItem(K,cur); }catch(e){} }
    else { try{ SC=sessionStorage.getItem(K); }catch(e){} }
  }catch(e){}
  if(!SC) return;

  // 站内地址补 sharecode；站外/已带参/非 http 返回 null
  function withSC(u){
    if(!u) return null;
    try{
      var x=new URL(u, location.href);
      if(x.protocol!=='http:' && x.protocol!=='https:') return null;
      if(x.origin!==location.origin) return null;
      if(x.searchParams.get('sharecode')===SC) return null;
      x.searchParams.set('sharecode',SC);
      return x.href;
    }catch(e){ return null; }
  }

  // 无参进入时补参数跳转（脚本捕获不到的情况兜底）
  if(!cur){
    var self=withSC(location.href);
    if(self && !/[?&]sharecode=/.test(location.search)){
      location.replace(self);
      return;
    }
  }

  // ① 点击拦截：先于站内任何处理器，动态渲染的卡片也覆盖
  document.addEventListener('click', function(e){
    var t=e.target;
    while(t && t!==document && t.tagName!=='A') t=t.parentNode;
    if(!t || t===document) return;
    if(t.target && t.target!=='_self') return;
    var h=t.getAttribute('href');
    if(!h || /^(mailto:|tel:|javascript:|#)/i.test(h)) return;
    var nu=withSC(t.href);
    if(!nu) return;
    e.preventDefault();
    e.stopPropagation();
    location.href=nu;
  }, true);

  // ② 静态与动态插入的资源统一补参
  var ATTRS=['src','href','poster','srcset'];
  var SEL='img[src],img[srcset],video[src],video[poster],audio[src],source[src],source[srcset],'+
          'script[src],link[rel=stylesheet][href],link[rel=preload][href],a[href]';
  function fixOne(el,attr){
    var v=el.getAttribute(attr);
    if(!v) return;
    if(attr==='srcset'){
      var changed=false;
      var parts=v.split(',').map(function(x){
        var t=x.trim().split(/\s+/);
        if(!t[0]) return x;
        var nu=withSC(t[0]);
        if(nu){ t[0]=nu; changed=true; }
        return t.join(' ');
      });
      if(changed) el.setAttribute('srcset',parts.join(', '));
      return;
    }
    var nu=withSC(v);
    if(nu) el.setAttribute(attr,nu);
  }
  function fixEl(el){
    for(var k=0;k<ATTRS.length;k++){
      if(el.hasAttribute && el.hasAttribute(ATTRS[k])) fixOne(el,ATTRS[k]);
    }
  }
  function fix(root){
    var scope=(root&&root.querySelectorAll)?root:document;
    var els=scope.querySelectorAll(SEL);
    for(var i=0;i<els.length;i++) fixEl(els[i]);
  }

  // ③ 资源加载失败时补参重试一次（防漏网）
  document.addEventListener('error', function(e){
    var el=e.target;
    if(!el||!el.tagName) return;
    var tag=el.tagName;
    if(tag!=='IMG'&&tag!=='VIDEO'&&tag!=='SOURCE'&&tag!=='AUDIO') return;
    if(el.getAttribute('data-sc-retry')) return;
    var nu=withSC(el.getAttribute('src')||'');
    if(!nu) return;
    el.setAttribute('data-sc-retry','1');
    el.setAttribute('src',nu);
  }, true);

  function boot(){
    fix(document);
    try{
      new MutationObserver(function(ms){
        for(var i=0;i<ms.length;i++){
          var added=ms[i].addedNodes;
          for(var j=0;j<added.length;j++){
            var n=added[j];
            if(n.nodeType!==1) continue;
            fixEl(n);
            if(n.querySelectorAll) fix(n);
          }
        }
      }).observe(document.documentElement,{childList:true,subtree:true});
    }catch(e){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();
</script>

  <!-- ═══════ 开始 ═══════ -->
  <section class="screen" id="scIntro">
    <div class="hero">
      <div class="icon">🧠</div>

  <section class="screen" id="scResult" hidden>

      <div class="score" id="scoreNum">0<small> 分</small></div>
      <p class="comment" id="comment"></p>
    </div>
    <div class="review">
      <h2>逐题回顾</h2>
      <div id="reviewList"></div>
    </div>
    <div class="endbtns">
      <button class="btn primary block" id="btnAgain">再测一次（换一套题）</button>
      <div class="row">
        <a class="btn" href="../index.html">🏠 回首页</a>
        <button class="btn" id="btnTop">↑ 回顶部</button>
      </div>
    </div>
    <p class="foot">题库由全站 320 道小题组成，答案经过逐题核对</p>
  </section>

</div>

:1,"p":"260921"},{"q":"想亲眼看到 M78，正确的做法是？（ ）","o":["夏天中午抬头找","肉眼直接就能看见","冬天的夜晚先找到猎户座腰带三星，再用望远镜在附近找","用显微镜看"],"a":2,"p":"260921"},{"q":"虾蟹煮熟变红，最主要的原因是？（ ）","o":["火把壳烤出了一层红色物质","虾壳里本来就有橙红色素，加热只是让它露出来","热水把壳染色了","虾的血跑到了壳上"],"a":1,"p":"260924"},{"q":"活虾为什么是青灰色的？（ ）","o":["活虾壳里没有色素","虾壳会反射所有光","虾青素被蛋白质抓住、改变了形状，于是吃掉的光变了","因为水把红色洗掉了"],"a":2,"p":"260924"},{"q":"加热在这个过程里扮演的角色是？（ ）","o":["制造新的红色素","让蛋白质变性、松开，放出虾青素","把蓝色光烧掉了","让虾壳变硬"],"a":1,"p":"260924"},{"q":"下列哪一项 不 是虾青素（类胡萝卜素家族）造成的？（ ）","o":["火烈鸟的粉红羽毛","三文鱼肉的橙红色","胡萝卜的橙色","青蛙的绿色皮肤"],"a":3,"p":"260924"},{"q":"有些深海虾活着的时候就是红色的，原因是？（ ）","o":["深海很热，等于被煮过","红色在深海等于隐形，因为红光早被水吸收了","它们吃了太多辣椒","红色能让同伴更容易找到它们"],"a":1,"p":"260924"},{"q":"牛顿实验里最关键、最能说明问题的一步是？（ ）","o":["让阳光穿过三棱镜分成七色","用第二块棱镜把七色光重新合回白光","把房间弄得很暗","在墙上量出彩带的宽度"],"a":1,"p":"260927"},{"q":"光在一颗雨滴里形成彩虹，走的路线是？（ ）","o":["只折射一次","折射进去 → 背面反射 → 折射出来","只在表面反射","直线穿过不拐弯"],"a":1,"p":"260927"},{"q":"主虹的颜色顺序是？（ ）","o":["外紫内红","外红内紫","上下排列","随机排列"],"a":1,"p":"260927"},{"q":"为什么你永远走不到彩虹的尽头？（ ）","o":["彩虹太高了","彩虹会移动得比你快","彩虹是以你眼睛为顶点的一组角度关系，你一动它就换一批水滴","彩虹是光的幻觉，并不存在"],"a":2,"p":"260927"},{"q":"关于外面那道更淡的\"霓\"，正确的是？（ ）","o":["它是主虹的倒影","光在水滴里多反射了一次，所以颜色顺序翻转、亮度更暗","它是月光造成的","它的颜色顺序和主虹一样"],"a":1,"p":"260927"},{"q":"开水壶口冒出的「白气」是什么？（ ）","o":["水蒸气本身","水汽遇冷抱团成的小水滴","烟","空气被烧焦了"],"a":1,"p":"260928"},{"q":"袜子晾在屋里会干，是因为水分子——（ ）","o":["慢慢分解消失了","渗进墙里了","跑得最快的那些挣脱了同伴，飞进了空气","被太阳吸走了"],"a":2,"p":"260928"},{"q":"为什么冰可乐瓶外面会「出汗」？（ ）","o":["瓶子漏水","瓶里的冰化了渗出来","瓶壁把周围空气降温，水汽被「挤下车」凝在瓶壁","空气中的灰尘粘上去了"],"a":2,"p":"260928"},{"q":"同样一团空气，温度降低后会发生什么？（ ）","o":["能装的水汽变多","能装的水汽变少，容易「现形」","水汽全部消失","没有任何变化"],"a":1,"p":"260928"},{"q":"桑拿天又闷又黏，真正的原因是？（ ）","o":["温度更高了","湿度太大，汗水蒸发不出去，身体散不了热","人缺水了","空气里的氧气变少了"],"a":1,"p":"260928"},{"q":"竖式算 23×4 时，为什么要拆成 3×4 和 20×4？","o":["老师规定必须这样","因为 23 本来就是 20+3，拆开算答案不变","因为整体乘太简单了"],"a":1,"p":"261014"},{"q":"算 32×23 时，第二行结果要往左挪一位，是因为……","o":["纸上要写得好看","那个 2 其实是 20，挪一位等于自动乘 10","随便写的"],"a":1,"p":"261014"},{"q":"个位算出 12，写 2 进 1，这个「1」的本质是……","o":["一个神秘咒语","10 枚硬币打包成 1 张十元，送到十位盒子","可以不进，忘了也没事"] },{"q":"骗子为什么总说「别告诉别人」「马上转」？","o":["怕您麻烦别人","为了让您紧张，把负责检查的那部分脑子压下去，同时切断能帮您核实的人","这是行规","因为转账有优惠"],"a":1,"p":"261023"},{"q":"接到可疑的「亲人求助」电话，最该做的第一件事是？","o":["先问清楚细节","先记下对方账号","立刻挂断，再用自己通讯录里的号码回拨","先转一点点试试"],"a":2,"p":"261023"},{"q":"台风能不能生成，最关键的开关是什么？","o":["海水温度够不够高","日历上翻到了几月","有没有冷空气南下","太阳直射点在哪里"],"a":0,"p":"261024"},{"q":"十月海水还很暖，最主要的原因是什么？","o":["十月太阳离地球最近","海水存热多、凉得慢","十月阳光比七月更强","海底火山一直在加热"],"a":1,"p":"261024"},{"q":"台风往哪个方向走，主要是谁在起作用？","o":["台风自己决定方向","地球自转的方向","海水的温度高低","副热带高压边缘"],"a":3,"p":"261024"},{"q":"冷空气遇到台风，可能带来什么结果？","o":["一定让台风马上减弱","让风更大、雨更猛","把台风变成龙卷风","让台风原地不动"],"a":1,"p":"261024"},{"q":"统计上，哪个月生成的台风更容易变强？","o":["七月","八月","十月","十二月"],"a":2,"p":"261024"}];

(function(){
  'use strict';
  const N = 10, PER_PAGE_MAX = 2;

  const $ = id => document.getElementById(id);
  const scIntro = $('scIntro'), scQuiz = $('scQuiz'), scResult = $('scResult');

  let deck = [], pos = 0, answers = [];

  $('fBank').textContent = BANK.length;
  $('fPages').textContent = new Set(BANK.map(q => q.p)).size;

  function shuffle(a){
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // 随机抽题：同篇文章最多 2 道，避免一套卷子全是一篇的题
  function pickQuestions(n){
    const pool = shuffle(BANK.slice());
    const picked = [], used = {};
    for (const q of pool){
      if (picked.length >= n) break;
      const c = used[q.p] || 0;
      if (c >= PER_PAGE_MAX) continue;
      used[q.p] = c + 1;
      picked.push(q);
    }
    if (picked.length < n){
      for (const q of pool){
        if (picked.length >= n) break;
        if (!picked.includes(q)) picked.push(q);
      }
    }
    return picked;
  }

  // 选项也打乱，并把正确答案挪到新位置
  function buildDeck(list){
    return list.map(q => {
      const idx = shuffle(q.o.map((_, i) => i));
      return {
        q: q.q,
        opts: idx.map(i => q.o[i]),
        ans: idx.indexOf(q.a),
        p: q.p
      };
    });
  }

  function show(which){
    [scIntro, scQuiz, scResult].forEach(s => s.hidden = (s !== which));
    window.scrollTo(0, 0);
  }

  function start(){
    deck = buildDeck(pickQuestions(N));
    pos = 0;
    answers = new Array(deck.length).fill(null);
    show(scQuiz);
    render();
  }

  function render(){
    const item = deck[pos];
    $('curNo').textContent = pos + 1;
    const rightNow = answers.filter((a, i) => a !== null && a === deck[i].ans).length;
    $('curScore').textContent = '已答对 ' + rightNow;
    $('barFill').style.width = (pos / deck.length * 100) + '%';
    $('qText').textContent = item.q;

    const box = $('opts');
    box.innerHTML = '';
    item.opts.forEach((text, i) => {
      const b = document.createElement('button');
      b.className = 'opt';
      b.type = 'button';
      b.innerHTML = '<span class="k">' + 'ABCD'[i] + '</span><span class="t"></span>';
      b.querySelector('.t').textContent = text;
      b.addEventListener('click', () => choose(i));
      box.appendChild(b);
    });

    $('verdict').className = 'verdict';
    $('verdict').innerHTML = '';
    $('btnNext').hidden = true;
    $('btnNext').textContent = (pos === deck.length - 1) ? '看结果 →' : '下一题 →';
  }

  function choose(pick){
    if (answers[pos] !== null) return;
    answers[pos] = pick;
    const item = deck[pos];
    const ok = pick === item.ans;

    const btns = [...$('opts').querySelectorAll('.opt')];
    btns.forEach((b, i) => {
      b.disabled = true;
      if (i === item.ans) b.classList.add('right');
      else if (i === pick) b.classList.add('wrong');
      else b.classList.add('dim');
    });

    const v = $('verdict');
    v.className = 'verdict on';
    if (ok){
      v.innerHTML = '<span class="ok">✅ 答对了</span>';
    } else {
      v.innerHTML = '<span class="no">❌ 答错了</span>　正确答案是 <b>' +
        'ABCD'[item.ans] + '. ' + esc(item.opts[item.ans]) + '</b>';
    }

    $('curScore').textContent = '已答对 ' + answers.filter((a, i) => a !== null && a === deck[i].ans).length;
    $('btnNext').hidden = false;
  }

  function esc(s){
    return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function next(){
    if (pos < deck.length - 1){
      pos++;
      render();
    } else {
      finish();
    }
  }

  function finish(){
    const right = answers.filter((a, i) => a === deck[i].ans).length;
    const score = Math.round(right / deck.length * 100);

    $('scoreNum').innerHTML = score + '<small> 分</small>';
    $('comment').innerHTML = comment(score, right);

    const list = $('reviewList');
    list.innerHTML = '';
    deck.forEach((item, i) => {
      const ok = answers[i] === item.ans;
      const div = document.createElement('div');
      div.className = 'ritem ' + (ok ? 'ok' : 'no');

      let html = '<p class="rq"><span class="mark">' + (ok ? '✅' : '❌') + '</span>' + esc(item.q) + '</p>';
      if (ok){
        html += '<p class="ra">你答对了：<span class="right-t">' + esc(item.opts[item.ans]) + '</span></p>';
      } else {
        const yours = answers[i] === null ? '（未作答）' : esc(item.opts[answers[i]]);
        html += '<p class="ra">你选的是 <span class="your-t">' + yours + '</span><br>' +
                '正确答案：<span class="right-t">' + esc(item.opts[item.ans]) + '</span></p>';
      }
      html += '<a class="rlink" href="../' + item.p + '/index.html">去读这篇 →</a>';
      div.innerHTML = html;
      list.appendChild(div);
    });

    $('barFill').style.width = '100%';
    show(scResult);
  }

  function comment(score, right){
    const base = '答对 ' + right + ' / ' + deck.length + ' 题。';
    if (score === 100) return base + '<span>满分。这套题里最难的几道也没难住你。</span>';
    if (score >= 80) return base + '<span>很稳。错的那一两道，点下面的链接读完就补上了。</span>';
    if (score >= 60) return base + '<span>及格线上下。错的题大多集中在某几类，顺着链接读两篇会明显不一样。</span>';
    if (score >= 30) return base + '<span>还有空间。这些题都能在站内文章里找到答案，读一篇回来再测一次。</span>';
    return base + '<span>别灰心——题目选项每次都不一样，这次只是抽到的题偏难。</span>';
  }

  $('btnStart').addEventListener('click', start);
  $('btnNext').addEventListener('click', next);
  $('btnAgain').addEventListener('click', start);
  $('btnTop').addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
})();
</script>
